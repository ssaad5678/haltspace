<title>Haltspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Kalam:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
/* Layout: a page tree on the left, one working surface on the right.
   Light "jade and ink" look by default; dark mode is the viewer's own toggle (html.wv-dark). */
:root{
  --bg:#F7F6F1; --panel:#FFFFFF; --side:#EFEEE7; --fg:#12163A; --muted:#51567A; --faint:#8A8DA6;
  --line:#E3E1D7; --line-2:#CBC8BB; --hover:rgba(18,22,58,.06);
  --accent:#0024CC; --accent-fg:#FFFFFF; --accent-soft:#E7EBFD; --accent-2:#B85E00;
  --brand-blue:#0024CC; --brand-amber:#B85E00; --brand-yellow:#FFE600; --brand-green:#00D973;
  --mark:#FFE58A; --danger:#C8333F; --danger-fg:#FFFFFF; --ok:#1D8A57; --warn:#B86A0B;
  --c-note:#0024CC; --c-canvas:#B85E00; --c-board:#00A85C; --c-folder:#C9A300;
  --t0:#0024CC; --t1:#B85E00; --t2:#00A85C; --t3:#8C7400; --t4:#5B3FD1; --t5:#C2255C;
  --canvas-bg:#FBFAF6; --canvas-dot:#D8D5C9;
  --scrim:rgba(20,28,24,.36);
  --shadow:0 1px 2px rgba(20,30,25,.06),0 10px 28px rgba(20,30,25,.09);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-ui:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --f-hand:"Kalam","Comic Sans MS",cursive;
  color-scheme:light;
}
html.wv-dark{
  --bg:#0D0F24; --panel:#151838; --side:#0A0C1D; --fg:#ECEEFA; --muted:#A5AAC8; --faint:#6F7498;
  --line:#262A50; --line-2:#363B6A; --hover:rgba(236,238,250,.07);
  --accent:#8096FF; --accent-fg:#060B2E; --accent-soft:#1D2554; --accent-2:#FF9A2E;
  --mark:#5E5012; --danger:#FF7584; --danger-fg:#2A0A0E; --ok:#52CF8E; --warn:#FFB35C;
  --c-note:#8096FF; --c-canvas:#FF9A2E; --c-board:#00D973; --c-folder:#FFE600;
  --t0:#8096FF; --t1:#FF9A2E; --t2:#00D973; --t3:#FFE600; --t4:#B9A8FF; --t5:#FF7FAF;
  --canvas-bg:#0C0E21; --canvas-dot:#282C52; --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.t-note{--tc:var(--c-note)} .t-canvas{--tc:var(--c-canvas)} .t-board{--tc:var(--c-board)} .t-folder{--tc:var(--c-folder)}
.tc0{--tc:var(--t0)} .tc1{--tc:var(--t1)} .tc2{--tc:var(--t2)} .tc3{--tc:var(--t3)} .tc4{--tc:var(--t4)} .tc5{--tc:var(--t5)}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%}
/* Sidebar */
.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:12px 8px 8px}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font:700 19px/1 var(--f-display);letter-spacing:-.01em}
.brand .logo{width:22px;height:22px;color:var(--accent);stroke-width:2.2}
.brand .only-mobile{margin-left:auto}
.search-btn{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:1px solid var(--line);background:var(--panel);border-radius:8px;color:var(--muted);text-align:left}
.search-btn:hover{border-color:var(--line-2)}
.search-btn kbd{margin-left:auto;font:500 10.5px var(--f-mono);color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.nav{display:flex;flex-direction:column;gap:1px;margin:10px 0 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;text-decoration:none}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.nav a .ic{color:var(--muted)}
.sb-scroll{flex:1;min-height:0;overflow:auto;margin:0 -4px;padding:0 4px 8px}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:12px 6px 4px 10px;font:600 10.5px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);border-radius:6px}
.sb-head.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.sb-empty{padding:6px 10px;color:var(--faint);font-size:12.5px}
.tree-row{display:flex;align-items:center;gap:1px;padding-left:calc(var(--d,0) * 14px);border-radius:6px;position:relative;min-height:30px}
.tree-row:hover{background:var(--hover)}
.tree-row.on{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.tree-row.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.twisty{width:20px;height:26px;display:grid;place-items:center;color:var(--faint);border-radius:4px;flex:none}
.twisty .ic{width:12px;height:12px;transition:transform .15s}
.twisty.open .ic{transform:rotate(90deg)}
.twisty.leaf{visibility:hidden}
.tree-link{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:5px 4px;text-decoration:none}
.tree-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-link .ic,.ti .ic{color:var(--tc)}
.untitled{color:var(--faint)}
.row-acts{display:none;gap:1px;padding-right:3px}
.tree-row:hover .row-acts,.tree-row:focus-within .row-acts{display:flex}
.mini{width:24px;height:24px;display:grid;place-items:center;border-radius:5px;color:var(--muted);flex:none}
.mini:hover{background:var(--hover);color:var(--fg)}
.mini .ic{width:14px;height:14px}
.sb-new{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:8px 2px 2px;border-top:1px solid var(--line)}
.sb-new button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:8px;font-size:12px;color:var(--muted)}
.sb-new button:hover{background:var(--panel);color:var(--fg)}
.sb-new .ic{width:18px;height:18px;color:var(--tc)}
.sync{display:flex;align-items:center;gap:7px;padding:8px 8px 2px;font:11px/1.3 var(--f-mono);color:var(--faint)}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
.sync[data-s="saving"]::before{background:var(--warn)}
.sync[data-s="pending"]::before{background:var(--faint)}
.sync[data-s="offline"]::before,.sync[data-s="error"]::before,.sync[data-s="nostore"]::before{background:var(--danger)}
.scrim{display:none}
.only-mobile{display:none!important}

/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:8px;height:50px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);flex:none;background:var(--bg)}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:1;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumbs a{text-decoration:none;padding:3px 6px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;max-width:180px;flex:0 1 auto}
.crumbs a:hover{background:var(--hover);color:var(--fg)}
.crumbs .sep{color:var(--faint);flex:none}
.crumbs .cur{display:flex;align-items:center;gap:7px;color:var(--fg);font-weight:500;padding:3px 6px;min-width:0}
.crumbs .cur span{overflow:hidden;text-overflow:ellipsis}
.crumbs .cur .ic{color:var(--tc)}
.top-actions{display:flex;align-items:center;gap:4px;flex:none}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:7px;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn.starred{color:var(--warn)}
.icon-btn.starred .ic{fill:currentColor}
.chip-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:7px;color:var(--muted);font-size:13px}
.chip-btn:hover{background:var(--hover);color:var(--fg)}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--hover)}
.seg button{padding:4px 11px;border-radius:6px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.view{flex:1;min-height:0;position:relative;overflow:hidden}

/* Shared page header */
.page-title{display:block;width:100%;border:0;background:none;resize:none;outline:none;font:700 clamp(28px,4.2vw,40px)/1.15 var(--f-display);letter-spacing:-.02em;padding:0;overflow:hidden;text-wrap:balance}
.page-title::placeholder{color:var(--faint)}
.page-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:10px 0 22px;font:12px var(--f-mono);color:var(--faint)}
.type-pill{display:inline-flex;align-items:center;gap:5px;color:var(--tc);font-weight:500}
.type-pill .ic{width:14px;height:14px}

/* Notes */
.doc-scroll{height:100%;overflow:auto}
.doc{max-width:780px;margin:0 auto;padding-block:44px 140px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.md-toolbar{position:sticky;top:0;display:flex;gap:2px;flex-wrap:wrap;padding:6px 0;background:var(--bg);z-index:2;border-bottom:1px solid var(--line);margin-bottom:18px}
.md-toolbar button{height:28px;min-width:30px;padding:0 7px;border-radius:6px;color:var(--muted);font:500 12.5px var(--f-mono);display:grid;place-items:center}
.md-toolbar button:hover{background:var(--hover);color:var(--fg)}
.md-toolbar .tsep{width:1px;background:var(--line);margin:5px 4px}
.md-editor{display:block;width:100%;min-height:50vh;border:0;outline:none;background:none;resize:none;font:14.5px/1.8 var(--f-mono);padding:0;overflow:hidden;tab-size:2}
.md-editor::placeholder{color:var(--faint)}
.doc .page-title{font-family:var(--note-head,var(--f-display))}
.md{font-size:16px;line-height:1.72;max-width:68ch;overflow-wrap:anywhere;font-family:var(--note-body,inherit)}
.md h1,.md h2,.md h3,.md h4{font-family:var(--note-head,var(--f-display));letter-spacing:-.01em;line-height:1.25;margin:1.6em 0 .5em;text-wrap:balance}
.md h1{font-size:1.75em}.md h2{font-size:1.38em}.md h3{font-size:1.15em}.md h4{font-size:1em}
.md > :first-child{margin-top:0}
.md p{margin:0 0 .9em}
.md ul,.md ol{padding-left:1.5em;margin:0 0 1em}
.md li{margin:.15em 0}
.md li.task{list-style:none;margin-left:-1.5em;display:flex;gap:9px;align-items:flex-start}
.md li.task input{margin-top:.42em;width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex:none}
.md li.task.done > span{color:var(--faint);text-decoration:line-through}
.md blockquote{margin:0 0 1em;padding:8px 16px;border-left:3px solid var(--line-2);color:var(--muted);background:var(--hover);border-radius:0 6px 6px 0}
.md code{font:.86em var(--f-mono);background:var(--hover);padding:1px 5px;border-radius:4px}
.md pre{background:var(--panel);border:1px solid var(--line);padding:14px 16px;border-radius:8px;overflow:auto;line-height:1.55}
.md pre code{background:none;padding:0}
.md hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.md mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:2px}
.md a:not(.wikilink){color:var(--accent)}
.empty-note{color:var(--faint)}
.wikilink{color:var(--accent);text-decoration:none;font-weight:500;border-bottom:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.wikilink:hover{border-bottom-color:var(--accent)}
.wikilink.missing{color:var(--muted);border-bottom:1px dashed var(--line-2)}
.tag{font:500 .82em var(--f-mono);color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:999px;cursor:pointer;white-space:nowrap}
.backlinks{margin-top:64px;padding-top:18px;border-top:1px solid var(--line)}
.bl-head{font:600 10.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.bl-item{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;margin:0 -10px;border-radius:8px;text-decoration:none}
.bl-item:hover{background:var(--hover)}
.bl-item .ic{margin-top:3px;color:var(--tc)}
.bl-t{font-weight:500}
.bl-ctx{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.bl-none{color:var(--faint);font-size:13.5px}
.ac{position:fixed;z-index:70;min-width:240px;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:4px}
.ac-i{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:6px;cursor:pointer;font-size:13.5px}
.ac-i.on{background:var(--accent-soft)}
.ac-i .ic{color:var(--tc)}
.ac-i span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Boards */
.board-page{height:100%;display:flex;flex-direction:column;min-height:0}
.board-page .page-head{padding-block:28px 0;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.board-page .page-meta{margin-bottom:12px}
.board{flex:1;min-height:0;display:flex;gap:12px;align-items:flex-start;overflow:auto;padding-block:6px 24px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.col{flex:0 0 290px;max-height:100%;display:flex;flex-direction:column;background:var(--side);border:1px solid var(--line);border-radius:10px;min-width:0}
.col-head{display:flex;align-items:center;gap:6px;padding:8px 6px 4px 10px}
.col-name{flex:1;min-width:0;border:0;background:none;font:600 14px var(--f-ui);padding:4px;border-radius:5px;outline:none}
.col-name:focus{background:var(--panel);box-shadow:0 0 0 1px var(--line-2)}
.col-count{font:11.5px var(--f-mono);color:var(--faint);padding:0 4px}
.cards{display:flex;flex-direction:column;gap:7px;padding:4px 8px 6px;overflow:auto;min-height:30px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:grab;user-select:none}
.card:hover{border-color:var(--line-2)}
.card.dragging{opacity:.35}
.card-title{font-weight:500;overflow-wrap:anywhere}
.col.done .card-title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.card-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;font:11px var(--f-mono);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;background:var(--hover);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .ic{width:12px;height:12px}
.chip.overdue{color:var(--danger);background:color-mix(in srgb,var(--danger) 13%,transparent)}
.chip.soon{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
.tagchip{color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.drop-line{height:3px;border-radius:2px;background:var(--accent);margin:-2px 0;flex:none}
.add-card{margin:0 8px 8px;padding:7px 8px;border-radius:6px;color:var(--muted);display:flex;gap:6px;align-items:center;font-size:13px}
.add-card:hover{background:var(--hover);color:var(--fg)}
.composer{margin:0 8px 8px;width:calc(100% - 16px);border:1px solid var(--accent);border-radius:8px;background:var(--panel);padding:9px 11px;resize:none;outline:none;font-size:14px}
.add-col{flex:0 0 220px;height:44px;border:1px dashed var(--line-2);border-radius:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.add-col:hover{color:var(--fg);border-color:var(--muted)}

/* Canvas */
.cv-wrap{position:absolute;inset:0;overflow:hidden;background:var(--canvas-bg)}
.cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
.cv-title{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));z-index:3;font:600 15px var(--f-display);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px;width:min(230px,30vw);outline:none;box-shadow:var(--shadow)}
.cv-title:focus{border-color:var(--accent)}
.cv-tools{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:1px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:3;max-width:calc(100% - 520px);overflow-x:auto;scrollbar-width:none}
.tool{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:7px;flex:none}
.tool:hover{background:var(--hover)}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool .k{position:absolute;right:3px;bottom:0;font:8.5px var(--f-mono);color:var(--faint)}
.tool .ic{width:18px;height:18px}
.tsep{width:1px;background:var(--line);margin:6px 3px;flex:none}
.cv-style{position:absolute;top:64px;left:max(12px,env(safe-area-inset-left,0px));width:216px;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px 12px;display:flex;flex-direction:column;gap:11px;max-height:calc(100% - 136px);overflow:auto}
.st-label{font:600 10px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:22px;height:22px;border-radius:6px;border:1px solid var(--line-2)}
.sw.on{outline:2px solid var(--accent);outline-offset:1px}
.sw.none{background:linear-gradient(135deg,transparent 44%,var(--danger) 44% 56%,transparent 56%),var(--panel)}
.opts{display:flex;gap:4px}
.opt{flex:1;height:28px;border-radius:6px;background:var(--hover);font-size:12px;display:grid;place-items:center;color:var(--muted)}
.opt.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.st-acts{display:flex;gap:4px;border-top:1px solid var(--line);padding-top:10px}
.st-acts .mini{width:30px;height:30px}
.st-acts .del{margin-left:auto;color:var(--danger)}
.cv-zoom{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:3;display:flex;align-items:center;gap:1px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow)}
.cv-zoom .mini{width:30px;height:30px}
.zl{font:500 12px var(--f-mono);min-width:50px;height:30px;border-radius:5px;color:var(--muted)}
.zl:hover{background:var(--hover)}
.zsep{width:1px;height:18px;background:var(--line);margin:0 3px}
.cv-hint{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:2;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;max-width:min(440px,40vw);pointer-events:none}
.cv-hint kbd{font:500 10.5px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--fg)}
.cv-edit{position:absolute;z-index:4;border:0;outline:none;resize:none;background:transparent;overflow:hidden;padding:0;margin:0;white-space:pre-wrap;overflow-wrap:break-word;line-height:1.3;min-width:4px}
.cv-empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:1}
.cv-empty div{text-align:center;color:var(--faint);max-width:340px;padding:0 16px}
.cv-empty strong{display:block;font:600 18px var(--f-display);color:var(--muted);margin-bottom:6px}

/* Graph */
.graph-wrap{position:absolute;inset:0;background:var(--canvas-bg);overflow:hidden}
.graph-panel{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));z-index:2;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:9px;font-size:13px;max-width:calc(100% - 24px)}
.gp-title{font:700 16px var(--f-display)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--tc);display:inline-block}
.gp-stat{font:11px var(--f-mono);color:var(--faint)}
.chk{display:flex;align-items:center;gap:7px;color:var(--muted)}
.chk input{accent-color:var(--accent)}

/* Home */
.home{height:100%;overflow:auto}
.home-in{max-width:1060px;margin:0 auto;padding-block:40px 90px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.hello{font:700 clamp(28px,4.4vw,40px)/1.1 var(--f-display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.hello-sub{color:var(--faint);margin-top:8px;font:12px var(--f-mono)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:26px 0 38px}
.q{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:left}
.q:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.q .ic{width:20px;height:20px;color:var(--tc)}
.q strong{font:600 15px var(--f-display)}
.q span{color:var(--muted);font-size:12.5px;line-height:1.4}
.sect-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 12px}
.sect-h h2{font:700 18px var(--f-display);margin:0;letter-spacing:-.01em}
.sect-h span{font:11.5px var(--f-mono);color:var(--faint)}
.recent{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rc{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:13px 15px;text-decoration:none;display:flex;flex-direction:column;gap:5px;min-height:116px;min-width:0}
.rc:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.rc-type{font:500 11px var(--f-mono);color:var(--tc);display:flex;gap:6px;align-items:center}
.rc-type .ic{width:13px;height:13px}
.rc-type em{font-style:normal;color:var(--faint);margin-left:auto}
.rc-title{font:600 15.5px/1.3 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-snip{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.home-cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;margin-top:40px}
.task-row{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);min-width:0}
.task-row:first-of-type{border-top:1px solid var(--line)}
.done-btn{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center;color:transparent}
.done-btn:hover{border-color:var(--ok);color:var(--ok)}
.done-btn .ic{width:11px;height:11px;stroke-width:2.6}
.task-t{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-t:hover{color:var(--accent)}
.task-row .chip{font:11px var(--f-mono);color:var(--muted);flex:none}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags .tag{font-size:12px;padding:3px 9px}
.tags .tag em{font-style:normal;color:var(--faint);margin-left:4px}
.muted-note{color:var(--faint);font-size:13.5px}
.empty-hero{max-width:560px;margin:8vh auto 0;text-align:left}
.empty-hero h1{font:700 clamp(30px,5vw,44px)/1.08 var(--f-display);letter-spacing:-.025em;margin:0 0 12px;text-wrap:balance}
.empty-hero p{color:var(--muted);font-size:15.5px;max-width:52ch;margin:0 0 22px}
.empty-acts{display:flex;flex-wrap:wrap;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:34px}
.three div{border-top:2px solid var(--tc);padding-top:10px}
.three strong{display:block;font:600 14px var(--f-display)}
.three span{color:var(--muted);font-size:12.5px}
.loading{display:grid;place-items:center;height:60vh;color:var(--faint);font:12px var(--f-mono)}

/* Buttons, popovers, palette, modal, toast */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel);font-weight:500;font-size:13.5px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-fg)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.link-danger{color:var(--danger);font-size:13px;padding:6px 2px}
.pop{position:fixed;z-index:60;min-width:210px;max-width:calc(100vw - 16px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px}
.pi{display:flex;width:100%;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;text-align:left;font-size:13.5px;white-space:nowrap}
.pi:hover,.pi:focus-visible{background:var(--hover)}
.pi .ic{color:var(--muted)}
.pi.danger,.pi.danger .ic{color:var(--danger)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.pop-h{font:600 10.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:8px 10px 4px}
.pop-none{padding:4px 10px 8px;color:var(--faint);font-size:13px;max-width:260px}
.confirm{padding:8px 10px 6px;max-width:270px}
.confirm p{margin:0 0 12px;font-size:13.5px}
.confirm .row{display:flex;gap:6px;justify-content:flex-end}
.palette{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.pal{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.pal input{width:100%;border:0;outline:none;background:none;padding:16px 18px;font-size:16px;border-bottom:1px solid var(--line)}
.pal-list{max-height:min(430px,55vh);overflow:auto;padding:6px}
.pal-item{display:flex;gap:11px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;min-width:0}
.pal-item.on{background:var(--accent-soft)}
.pal-item .ic{color:var(--tc,var(--muted))}
.pi-txt{display:flex;flex-direction:column;min-width:0}
.pi-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-item .sub{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-empty{padding:16px 12px;color:var(--faint)}
.pal-foot{font:10.5px var(--f-mono);color:var(--faint);padding:8px 14px;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:55;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px 16px;overflow:auto}
.mc{width:min(580px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 20px 18px;display:flex;flex-direction:column;gap:14px}
.mc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mc-title{width:100%;border:0;outline:none;background:none;resize:none;font:700 22px/1.25 var(--f-display);padding:0;overflow:hidden}
.mc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span{font:600 10px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:7px 9px;outline:none;font-size:13.5px;min-width:0}
.fld textarea{resize:vertical;line-height:1.55}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent)}
.mc-link{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mc-link a{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;text-decoration:none;font-weight:500;max-width:100%;overflow:hidden}
.mc-link a .ic{color:var(--tc)}
.mc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;font:11px var(--f-mono);color:var(--faint);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--fg);color:var(--bg);padding:9px 10px 9px 15px;border-radius:9px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;font-size:13.5px;max-width:calc(100vw - 32px)}
.toast button{font-weight:600;color:var(--bg);padding:3px 8px;border-radius:5px;background:color-mix(in srgb,var(--bg) 16%,transparent)}

/* Font picker */
.fp{position:fixed;inset:0;z-index:58;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:7vh 16px 16px}
.fp-box{width:min(660px,100%);max-height:86vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.fp-head{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.fp-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.fp-top strong{font:700 17px var(--f-display)}
.fp-top span{font:11px var(--f-mono);color:var(--faint)}
.fp-search,.fp-sample,.fp-foot input{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 11px;outline:none;font-size:14px;min-width:0}
.fp-search{font-size:15px;padding:9px 12px}
.fp-search:focus,.fp-sample:focus,.fp-foot input:focus{border-color:var(--accent)}
.fp-row{display:flex;gap:6px;flex-wrap:wrap}
.fp-cat{height:28px;padding:0 11px;border-radius:999px;background:var(--hover);font-size:12.5px;color:var(--muted)}
.fp-cat.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.fp-cat em{font-style:normal;font:10.5px var(--f-mono);margin-left:5px;opacity:.75}
.fp-list{overflow:auto;padding:6px;flex:1;min-height:220px}
.fp-item{display:flex;align-items:center;gap:14px;width:100%;padding:8px 12px;border-radius:8px;text-align:left;min-width:0}
.fp-item:hover,.fp-item:focus-visible{background:var(--hover)}
.fp-item.on{background:var(--accent-soft)}
.fp-name{font-size:23px;line-height:1.3;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-meta{font:11px var(--f-mono);color:var(--faint);flex:none;text-align:right;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-sec{font:600 10.5px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:12px 12px 4px}
.fp-foot{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.fp-foot input{flex:1;min-width:150px;width:auto}
.font-pick{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:34px;padding:0 10px;border-radius:6px;background:var(--hover);font-size:14px;margin-top:5px;min-width:0}
.font-pick:hover{background:var(--accent-soft)}
.font-pick.on{background:var(--accent-soft);color:var(--accent)}
.font-pick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.font-pick em{font:normal 10.5px var(--f-mono);color:var(--faint);flex:none}
.note-acts{display:flex;align-items:center;gap:4px}
.fonts-btn{font:600 14px var(--f-display)}
.font-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 10px;min-width:260px}
.font-row div{display:flex;flex-direction:column;min-width:0}
.font-row small{font:600 10px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.font-row span{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}

/* Labeled ribbon, picture tools, header & footer, PDF sheet, theme button */
.ribbon{gap:0;padding-block:4px}
.rgroup{display:flex;align-items:center;gap:1px;padding:0 6px;border-right:1px solid var(--line)}
.rgroup:last-of-type{border-right:0}
.ribbon .rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;height:52px;padding:4px 6px;border-radius:8px;color:var(--fg);position:relative}
.ribbon .rb .ic{width:19px;height:19px}
.ribbon .rb span{font-size:11px;line-height:1;color:var(--muted);white-space:nowrap}
.ribbon .rb:hover span,.ribbon .rb.on span{color:inherit}
.ribbon .rb.on{background:var(--accent-soft);color:var(--accent)}
.ribbon .rb .cbar{left:17px;right:17px;top:29px;bottom:auto;height:3px}
.rstack{flex-direction:column;align-items:stretch;gap:4px;padding-block:2px}
.rstack select{max-width:none;width:176px}
.rrow{display:flex;gap:4px}
.rrow .rfont{flex:1;min-width:0;max-width:none;height:30px}
.rrow select{width:62px}
.img-bar{position:absolute;z-index:6;display:flex;align-items:center;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);animation:wv-pop .16s cubic-bezier(.2,.8,.2,1)}
.img-bar button{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:7px;font-size:12.5px;color:var(--fg)}
.img-bar button:hover{background:var(--hover)}
.img-bar button.danger{color:var(--danger)}
.img-bar .ic{width:15px;height:15px}
.ibsep{width:1px;height:18px;background:var(--line);margin:0 3px}
.img-handle{position:absolute;z-index:6;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--panel);box-shadow:var(--shadow);cursor:nwse-resize;touch-action:none}
.rt img.img-sel{outline:3px solid var(--accent);outline-offset:2px}
.hf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;font-size:12px;line-height:1.45;color:var(--muted);border-radius:6px;cursor:pointer;padding:6px 8px;margin:0 -8px;min-height:28px;transition:background .15s}
.hf:hover{background:var(--hover)}
.hf-head{margin-top:-30px;margin-bottom:26px}
.hf-foot{margin-top:40px}
.hf-head.lined{border-bottom:1px solid var(--line-2);border-radius:6px 6px 0 0}
.hf-foot.lined{border-top:1px solid var(--line-2);border-radius:0 0 6px 6px}
.hf .hf-c{text-align:center}.hf .hf-r{text-align:right}
.hf.empty{display:block;opacity:0}
.paper:hover .hf.empty,.hf.empty:focus-visible{opacity:1}
.hf-add{display:inline-flex;align-items:center;gap:6px;color:var(--faint)}
.hf-add .ic{width:13px;height:13px}
.hfm{width:min(760px,100%);gap:12px}
.hfm-t{font:700 19px var(--f-display)}
.hf-label{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.hf-temps{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.hf-temp{position:relative;display:flex;flex-direction:column;gap:6px;padding:7px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:12px;text-align:left;transition:border-color .15s,transform .15s}
.hf-temp:hover{border-color:var(--accent);transform:translateY(-2px)}
.hf-temp.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.hf-temp em{position:absolute;top:3px;right:3px;width:20px;height:20px;display:grid;place-items:center;border-radius:5px;background:var(--panel);color:var(--muted)}
.hf-temp em .ic{width:12px;height:12px}
.ht-mini{background:#fff;border:1px solid #e3e7e3;border-radius:4px;height:76px;padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;color:#56635D}
.ht-h,.ht-f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;font-size:5.5px;line-height:1.3;min-height:7px;overflow:hidden}
.ht-h div:nth-child(2),.ht-f div:nth-child(2){text-align:center}.ht-h div:nth-child(3),.ht-f div:nth-child(3){text-align:right}
.ht-lines{display:flex;flex-direction:column;gap:4px}
.ht-lines i{display:block;height:3px;border-radius:2px;background:#e6eae6}
.ht-lines i:nth-child(2){width:80%}.ht-lines i:nth-child(3){width:60%}
.hf-band{display:flex;flex-direction:column;gap:6px}
.hf-band-h{font-weight:600;font-size:13.5px}
.hf-boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hf-box{display:flex;flex-direction:column;gap:4px}
.hf-box span{font:11px var(--f-mono);color:var(--faint)}
.hf-box:nth-child(2) span,.hf-box:nth-child(2) textarea{text-align:center}
.hf-box:nth-child(3) span,.hf-box:nth-child(3) textarea{text-align:right}
.hf-box textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:7px 9px;resize:none;outline:none;font-size:13px;line-height:1.4}
.hf-box textarea:focus{border-color:var(--accent);background:var(--panel)}
.hf-ins{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.hf-prev{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 18px;color:#56635D;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 4px #f4f6f4}
.hp-h,.hp-f{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;font-size:11px;line-height:1.4;min-height:16px}
.hp-h div:nth-child(2),.hp-f div:nth-child(2){text-align:center}.hp-h div:nth-child(3),.hp-f div:nth-child(3){text-align:right}
.hp-h.lined{border-bottom:1px solid #cfd6d0;padding-bottom:6px}.hp-f.lined{border-top:1px solid #cfd6d0;padding-top:6px}
.hp-body{display:flex;flex-direction:column;gap:6px;padding:6px 0}
.hp-body i{display:block;height:5px;border-radius:3px;background:#eceeec}
.hp-body i:nth-child(1){width:45%;height:8px;background:#dfe4df}.hp-body i:nth-child(4){width:85%}.hp-body i:nth-child(5){width:65%}
.hf-save{display:flex;gap:6px;flex:1;min-width:240px}
.hf-save input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:6px 9px;outline:none;font-size:13px}
.hfm .mc-foot{font:inherit;color:inherit}
.pdf-sheet{position:fixed;left:-12000px;top:0;background:#fff;color:#1B2420;--fg:#1B2420;--muted:#56635D;--faint:#86918B;--line:#DCE1DC;--line-2:#C4CCC6;--hover:rgba(0,0,0,.05);--panel:#fff;--bg:#fff;--accent:#0E7C66;--accent-soft:#DCF0EA;--mark:#FFE58A;font-family:var(--f-ui)}
.pdf-sheet .pdf-title{font:700 30px/1.2 var(--note-head,var(--f-display));margin:0 0 18px;padding-top:2px;color:#1B2420}
.pdf-sheet .rt{min-height:0}
.pdf-sheet .rt img{border:0}
.theme-btn{display:flex;align-items:center;gap:8px;margin:6px 4px 0;padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--muted)}
.theme-btn:hover{background:var(--panel);color:var(--fg)}
.theme-btn .ic{width:16px;height:16px}
.cv-tools{left:max(256px,env(safe-area-inset-left,0px));transform:none;max-width:calc(100% - 268px);padding:3px}
.tool{width:auto;min-width:41px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 3px}
.tool .ic{width:19px;height:19px}
.tool .tl{font-size:10.5px;line-height:1;color:var(--muted);white-space:nowrap}
.tool.on .tl{color:var(--accent);font-weight:500}
.tool .k{display:none}
.cv-style{top:72px}
.fs-row{display:flex;gap:4px;align-items:center}
.fs-row .opt{flex:0 0 38px}
.fs-row input{flex:1;min-width:0;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:center;font:500 13px var(--f-mono);outline:none}
.fs-row input:focus{border-color:var(--accent)}
[data-fsrange]{width:100%;margin-top:8px;accent-color:var(--accent)}

/* ---- Scrollbars: slim, rounded, theme-colored ---- */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--fg) 24%,transparent) transparent}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--fg) 20%,transparent);border-radius:999px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--accent) 65%,transparent)}
::-webkit-scrollbar-corner{background:transparent}
.ribbon,.cv-tools,.tpl-strip{scrollbar-width:none}
.ribbon::-webkit-scrollbar,.cv-tools::-webkit-scrollbar{display:none}
.note-wrap,.home,.doc-scroll,.pal-list,.fp-list{scroll-behavior:smooth}

/* ---- Ripple + button polish ---- */
.rb,.tool,.btn,.q,.sq,.tpl-chip,.tpl-card,.nav a,.sb-new button,.pb,.slash-i,.theme-btn{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);animation:wv-ripple .6s ease-out forwards;pointer-events:none}
@keyframes wv-ripple{to{transform:scale(1);opacity:0}}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--accent-2)));border-color:transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s ease}
.btn.primary:hover::after{transform:translateX(120%)}
.btn.primary:hover{filter:none;transform:translateY(-1px)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}
.skel{height:44px;border-radius:8px;margin:6px 0;background:linear-gradient(90deg,var(--hover) 25%,color-mix(in srgb,var(--fg) 10%,transparent) 50%,var(--hover) 75%);background-size:300% 100%;animation:wv-shimmer 1.2s linear infinite}
@keyframes wv-shimmer{from{background-position:100% 0}to{background-position:-200% 0}}
.nav-count{margin-left:auto;font:600 10.5px var(--f-mono);font-style:normal;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:999px}
.sb-foot{display:flex;gap:2px;margin-top:4px}
.sb-foot .theme-btn{flex:1;margin:0;text-decoration:none}
.sb-foot .theme-btn.on{background:var(--panel);color:var(--fg)}
.nav a{transition:background .15s,transform .15s}
.nav a:hover{transform:translateX(2px)}

/* ---- Pages in notes: real A4 sheets ---- */
.note-wrap{position:relative}
.read-progress{position:sticky;top:61px;z-index:4;height:3px;margin-bottom:-3px;pointer-events:none}
.read-progress{overflow:hidden}
.read-progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transform-origin:0 50%;transform:scaleX(0);transition:transform .12s linear;border-radius:0 3px 3px 0}
.paper.paged{width:794px;max-width:none;margin:30px auto 28px;padding:104px 72px 0;background:transparent;border:0;box-shadow:none;border-radius:0;position:relative;box-sizing:border-box}
.paper.paged > .page-title,.paper.paged > .page-meta,.paper.paged > .tpl-strip,.paper.paged > .rt{position:relative;z-index:1}
.paper.paged .rt{min-height:500px}
.sheets-bg,.sheets-fg{position:absolute;inset:0;pointer-events:none}
.sheets-bg{z-index:0}.sheets-fg{z-index:2}
.paper:not(.paged) .sheets-bg,.paper:not(.paged) .sheets-fg{display:none}
.sheet{position:absolute;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);animation:wv-in .35s cubic-bezier(.2,.8,.2,1) both}
.sheet-fg{position:absolute;left:0;right:0}
.sh-band{pointer-events:auto;position:absolute;left:72px;right:72px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;font-size:11.5px;line-height:1.45;color:var(--muted);cursor:pointer;padding:6px 8px;margin:0 -8px;border-radius:6px;transition:background .15s,opacity .15s}
.sh-band div:nth-child(2){text-align:center}.sh-band div:nth-child(3){text-align:right}
.sh-head{top:38px}.sh-foot{bottom:34px}
.sh-band:hover{background:var(--hover)}
.sh-band.lined.sh-head{border-bottom:1px solid var(--line-2);border-radius:6px 6px 0 0}
.sh-band.lined.sh-foot{border-top:1px solid var(--line-2);border-radius:0 0 6px 6px}
.sh-band.empty{display:block;opacity:0}
.sheet-fg:hover .sh-band.empty,.sh-band.empty:focus-visible{opacity:1}
.sh-num{position:absolute;right:4px;bottom:-21px;font:500 10.5px var(--f-mono);color:var(--faint);pointer-events:none}
.rt hr.page-break{border:0;height:0;margin:14px 0;position:relative;overflow:visible;border-top:2px dashed color-mix(in srgb,var(--accent) 45%,transparent)}
.rt hr.page-break::after{content:"Page break";position:absolute;left:50%;top:-10px;transform:translateX(-50%);background:var(--panel);color:var(--accent);font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--accent-soft)}
.paper.paged hr.page-break{opacity:.65}
.note-bl{max-width:794px;margin:0 auto 120px;padding:18px 24px 0}
.to-top{position:sticky;float:right;bottom:22px;margin:-60px 22px 0 0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-fg);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent);z-index:6;animation:wv-pop .25s cubic-bezier(.2,.9,.25,1.2);transition:transform .2s}
.to-top:hover{transform:translateY(-3px)}
.to-top .ic{width:20px;height:20px}
.rt blockquote.callout{border-left:0;border-radius:10px;padding:12px 16px 12px 46px;background:var(--accent-soft);color:var(--fg);position:relative}
.rt blockquote.callout::before{content:"";position:absolute;left:15px;top:14px;width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.rt blockquote.callout p:last-child{margin-bottom:0}
.rt ul.todo-list > li[data-done="true"]::before{animation:wv-check .35s cubic-bezier(.2,.9,.25,1.6)}
@keyframes wv-check{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ---- Slash menu ---- */
.slash{position:fixed;z-index:72;width:290px;max-height:330px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;animation:wv-pop .16s cubic-bezier(.2,.8,.2,1);transform-origin:top left}
.slash-h{font:600 10px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:7px 9px 4px}
.slash-i{display:flex;align-items:center;gap:11px;padding:6px 8px;border-radius:8px;cursor:pointer}
.slash-i.on{background:var(--accent-soft)}
.slash-ic{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.slash-i.on .slash-ic{border-color:var(--accent);color:var(--accent)}
.slash-t{display:flex;flex-direction:column;min-width:0}
.slash-t b{font-weight:500;font-size:13.5px}
.slash-t small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- Templates ---- */
.tpl-strip{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-6px 0 18px;padding:10px 12px;border:1px dashed var(--line-2);border-radius:10px;color:var(--muted);font-size:12.5px;animation:wv-in .35s cubic-bezier(.2,.8,.2,1)}
.tpl-strip > span{margin-right:4px}
.tpl-chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;color:var(--fg);transition:border-color .15s,transform .15s}
.tpl-chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.tpl-chip .ic{width:14px;height:14px;color:var(--accent)}
.tpl-chip.ghost{background:none;border-style:dashed}
.tplm{width:min(760px,100%)}
.tpl-tabs{align-self:flex-start}
.tpl-tabs button{display:inline-flex;align-items:center;gap:6px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tpl-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .2s;animation:wv-rise .35s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 35ms)}
.tpl-card:hover{transform:translateY(-3px);border-color:var(--tc,var(--accent));box-shadow:var(--shadow)}
.tpl-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc,var(--accent)) 14%,transparent);color:var(--tc,var(--accent))}
.tpl-ic .ic{width:20px;height:20px}
.tpl-card b{font:600 14.5px var(--f-display)}
.tpl-card small{color:var(--muted);font-size:12.5px;line-height:1.4}
.t-tpl{--tc:var(--accent-2)}

/* ---- Drawings inside notes ---- */
.rt figure.sketch{margin:10px 0 14px;user-select:none;cursor:pointer}
.sk-frame{position:relative;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;min-height:120px;display:grid;place-items:center;transition:box-shadow .2s,border-color .2s,transform .2s}
.sk-frame:hover{border-color:var(--accent);box-shadow:0 8px 26px color-mix(in srgb,var(--accent) 18%,transparent);transform:translateY(-1px)}
.sk-img{display:block;max-width:100%;max-height:520px;margin:0 auto;border:0!important}
.sk-empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:#86918B;padding:30px;font-size:13px}
.sk-empty .ic{width:28px;height:28px;color:var(--accent)}
.sk-gone{color:#86918B;font-size:13px;padding:24px}
.sk-bar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s}
.sk-frame:hover .sk-bar{opacity:1;transform:none}
.sk-name{display:inline-flex;align-items:center;gap:6px;flex:1;min-width:0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sk-bar button{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:7px;font-size:12.5px;background:var(--accent);color:var(--accent-fg)}
.sk-bar button + button{background:var(--hover);color:var(--fg)}
.sk-bar .ic{width:14px;height:14px}
.pdf-sheet .sk-bar{display:none}
.pdf-sheet .sk-frame{border:0}
.sk-editor{position:fixed;inset:0;z-index:57;display:flex;flex-direction:column;background:var(--scrim);padding:24px max(24px,env(safe-area-inset-left,0px));animation:wv-fade .2s ease-out}
.sk-editor.closing{animation:wv-fade .2s ease-in reverse forwards}
.ske-top{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0}
.ske-t{display:inline-flex;align-items:center;gap:8px;font:600 15px var(--f-display)}
.ske-t .ic{color:var(--c-canvas)}
.ske-hint{flex:1;color:var(--muted);font-size:12.5px}
.ske-body{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:0 0 14px 14px;overflow:hidden;box-shadow:var(--shadow);animation:wv-pop .28s cubic-bezier(.2,.9,.25,1.1)}
@media (max-width:640px){ .sk-editor{padding:0} .ske-top{border-radius:0} .ske-body{border-radius:0} .ske-hint{display:none} }

/* ---- Canvas frames & presenting ---- */
.present-btn{background:var(--accent-soft);color:var(--accent);font-weight:500}
.present-btn:hover{background:var(--accent);color:var(--accent-fg)}
.cv-wrap.presenting .cv-tools,.cv-wrap.presenting .cv-style,.cv-wrap.presenting .cv-zoom,.cv-wrap.presenting .cv-hint,.cv-wrap.presenting .cv-title,.cv-wrap.presenting .cv-empty{display:none!important}
.pres-bar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:4px;padding:6px;background:rgba(18,24,21,.82);color:#fff;border-radius:14px;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.3);animation:wv-toast .35s cubic-bezier(.2,.9,.25,1.2)}
.pb{display:inline-flex;align-items:center;gap:6px;height:38px;min-width:38px;padding:0 10px;border-radius:10px;color:#fff;font-size:13px;justify-content:center}
.pb:hover{background:rgba(255,255,255,.12)}
.pb.on{background:#FF3B30}
.pb .ic{width:18px;height:18px}
.pres-n{padding:0 12px;font:500 13px var(--f-ui);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.pres-sep{width:1px;height:20px;background:rgba(255,255,255,.2);margin:0 4px}

/* ---- Home: today panel + streak ---- */
.today-panel{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px;margin-top:22px}
.tp-streak,.tp-today{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);min-width:0}
.tp-streak b,.tp-today b{display:block;font:600 15px var(--f-display)}
.tp-streak small,.tp-today small{display:block;color:var(--muted);font-size:12.5px}
.flame{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--hover);color:var(--faint)}
.flame .ic{width:24px;height:24px}
.tp-streak.lit .flame{background:color-mix(in srgb,var(--accent-2) 16%,transparent);color:var(--accent-2)}
.tp-streak.lit .flame .ic{fill:color-mix(in srgb,var(--accent-2) 35%,transparent);animation:wv-flicker 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wv-flicker{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}
.tp-week{display:flex;gap:5px;margin-left:auto}
.tp-week i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font:600 10px var(--f-mono);font-style:normal;background:var(--hover);color:var(--faint)}
.tp-week i.on{background:var(--accent);color:var(--accent-fg);animation:wv-pop .4s cubic-bezier(.2,.9,.25,1.4) both}
.tp-today{text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s}
.tp-today:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.tp-today > span{flex:1;min-width:0}
.tp-today > .ic{color:var(--faint)}
.ring{width:46px;height:46px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring-bg{stroke:var(--hover)}
.ring-fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}

/* ---- Calendar ---- */
.home-in.wide{max-width:1180px}
.cal{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.cal-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cal-top h2{font:700 20px var(--f-display);margin:0 6px;min-width:170px;text-align:center}
.cal-tip{margin-left:auto;font-size:12px;color:var(--faint)}
.cal-dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-cell{min-height:112px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;transition:border-color .15s,background .15s,transform .15s;animation:wv-rise .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 8ms)}
.cal-cell.out{background:transparent;opacity:.55}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cal-cell.today .cal-d span{background:var(--accent);color:var(--accent-fg)}
.cal-cell.drop{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.02)}
.cal-d{display:flex;align-items:center;justify-content:space-between}
.cal-d span{font:600 12px var(--f-mono);min-width:24px;height:24px;display:grid;place-items:center;border-radius:7px}
.cal-daily{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--faint);opacity:0;transition:opacity .15s,background .15s}
.cal-cell:hover .cal-daily,.cal-daily.has{opacity:1}
.cal-daily.has{color:var(--accent)}
.cal-daily:hover{background:var(--hover)}
.cal-daily .ic{width:14px;height:14px}
.cal-items{display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-chip{font-size:11.5px;padding:3px 7px;border-radius:6px;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--fg);border-left:3px solid var(--tc);cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:transform .15s}
.cal-chip:hover{transform:translateX(2px)}
.cal-chip.done{opacity:.55;text-decoration:line-through}
.cal-chip.dragging{opacity:.4}
.cal-more{font-size:11px;color:var(--faint);padding-left:4px}
.cal-tray{margin-top:8px;border:1px dashed var(--line-2);border-radius:10px;padding:10px;transition:background .15s}
.cal-tray.drop{background:var(--accent-soft)}
.cal-tray-h{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.cal-tray-items{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:720px){ .cal-cell{min-height:72px} .cal-chip{font-size:10px;padding:2px 4px} .cal-tip{display:none} .today-panel{grid-template-columns:minmax(0,1fr)} .tp-week{display:none} }

/* ---- Board views ---- */
.bv-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0 12px}
.bv-row .page-meta{margin:0}
.bv-switch button{display:inline-flex;align-items:center;gap:6px}
.bv-switch .ic{width:14px;height:14px}
.bview{flex:1;min-height:0;overflow:auto;padding:0 max(28px,env(safe-area-inset-right,0px)) 30px max(28px,env(safe-area-inset-left,0px))}
.bt-wrap{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:auto}
.bt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:680px}
.bt th{text-align:left;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0}
.bt td{padding:4px 6px;border-bottom:1px solid var(--line)}
.bt tr{animation:wv-rise .3s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 20ms)}
.bt tr:hover td{background:var(--hover)}
.bt-in{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;padding:6px 8px;outline:none;font-size:13.5px;min-width:0}
.bt-in:hover{border-color:var(--line)}
.bt-in:focus{border-color:var(--accent);background:var(--panel)}
.bt-in.overdue{color:var(--danger)}
.bt-title{font-weight:500}
.bt-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;padding:0 8px}
.bt-link .ic{color:var(--tc);width:14px;height:14px}
.bt-empty{padding:14px}
.add-row{display:flex;align-items:center;gap:6px;width:100%;padding:10px 14px;color:var(--muted);font-size:13px}
.add-row:hover{background:var(--hover);color:var(--fg)}

/* ---- Trash & history ---- */
.page-h{align-items:center!important}
.trash-list{display:flex;flex-direction:column;gap:6px;margin-top:20px}
.trash-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);animation:wv-rise .3s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 30ms)}
.trash-row > .ic{color:var(--tc)}
.tr-t{flex:1;min-width:0;display:flex;flex-direction:column}
.tr-t b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-t small{color:var(--muted);font-size:12px}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:60px 20px;color:var(--muted)}
.empty-state > .ic{width:44px;height:44px;color:var(--faint);animation:wv-float 3s ease-in-out infinite}
.empty-state h2{font:700 20px var(--f-display);color:var(--fg);margin:8px 0 0}
.empty-state p{margin:0;max-width:40ch}
@keyframes wv-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hist{width:min(980px,100%)}
.hist-sub{margin:-6px 0 0;color:var(--muted);font-size:13px}
.hist-body{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px;min-height:360px;max-height:62vh}
.hist-list{display:flex;flex-direction:column;gap:3px;overflow:auto;padding-right:4px}
.hist-i{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px;border-radius:8px;text-align:left;border:1px solid transparent}
.hist-i:hover{background:var(--hover)}
.hist-i.on{background:var(--accent-soft);border-color:var(--accent)}
.hist-i b{font-weight:500;font-size:13px}
.hist-i small{color:var(--muted);font-size:11.5px}
.hist-prev{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:18px 22px}
.hist-doc{font-size:14px}
.hist-img{max-width:100%;border-radius:8px;background:#fff}
.hist-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;font-size:13px}
.hist-board ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
@media (max-width:720px){ .hist-body{grid-template-columns:minmax(0,1fr);max-height:none} .hist-list{max-height:180px} }

/* ---- Color themes chosen in the profile ---- */
html[data-accent="ocean"]{--accent:#0B6E99;--accent-2:#F08C00;--c-note:#0B6E99}
html.wv-dark[data-accent="ocean"]{--accent:#4FB3E0;--accent-2:#FFB347;--c-note:#4FB3E0}
html[data-accent="sunset"]{--accent:#D9480F;--accent-2:#7048E8;--c-note:#D9480F}
html.wv-dark[data-accent="sunset"]{--accent:#FF8A5B;--accent-2:#A78BFA;--c-note:#FF8A5B}
html[data-accent="grape"]{--accent:#6741D9;--accent-2:#12B886;--c-note:#6741D9}
html.wv-dark[data-accent="grape"]{--accent:#A78BFA;--accent-2:#38D9A9;--c-note:#A78BFA}
html[data-accent="rose"]{--accent:#C2255C;--accent-2:#1098AD;--c-note:#C2255C}
html.wv-dark[data-accent="rose"]{--accent:#F06595;--accent-2:#3BC9DB;--c-note:#F06595}
html[data-accent]:not([data-accent="jade"]){--accent-soft:color-mix(in srgb,var(--accent) 14%,var(--panel))}
html:not(.wv-dark)[data-accent]:not([data-accent="jade"]){--accent-fg:#fff}
html.wv-dark[data-accent]:not([data-accent="jade"]){--accent-fg:#111}

/* ---- Modern shell: floating panels on a soft gradient ---- */
body{background:radial-gradient(900px 520px at 105% -10%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 62%),radial-gradient(760px 480px at -8% 108%,color-mix(in srgb,var(--accent-2) 12%,transparent),transparent 60%),var(--bg)}
.app{padding:10px;gap:10px;background:transparent}
.sidebar{border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 86%,transparent);box-shadow:0 1px 2px rgba(20,30,25,.04),0 12px 30px rgba(20,30,25,.06)}
.main{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg);box-shadow:0 1px 2px rgba(20,30,25,.04),0 12px 30px rgba(20,30,25,.06)}
.topbar{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);position:relative;z-index:3}
.view{background:transparent;isolation:isolate}
.view > .home,.view > .note-wrap,.view > .board-page,.view > .loading{position:relative;z-index:1}
.view > .cv-wrap,.view > .graph-wrap{z-index:1}
.note-wrap{background:transparent}
.brand{padding:4px 6px 14px}
.logo-wrap{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.logo-wrap .logo{color:#fff;width:18px;height:18px}
.nav a.on{background:var(--accent-soft);box-shadow:none;color:var(--accent);font-weight:500}
.nav a.on .ic{color:var(--accent)}
.nav a::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--accent);transform:scaleY(0);transition:transform .2s}
.nav a.on::before{transform:scaleY(1)}
.tree-row.on{background:var(--accent-soft);box-shadow:none}
.sb-new{grid-template-columns:repeat(4,minmax(0,1fr))}
.search-btn{border-radius:10px;transition:border-color .15s,box-shadow .15s}
.search-btn:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (max-width:820px){ .app{padding:0;gap:0} .main{border-radius:0;border:0} .sidebar{border-radius:0 18px 18px 0} }

/* ---- Background shapes ---- */
.view-deco{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.dz{position:absolute;width:var(--s);height:var(--s);color:var(--accent);opacity:.7;will-change:transform}
.dz svg{width:100%;height:100%;display:block;overflow:visible}
.dz-blob,.dz-blob2{opacity:.22;filter:blur(1px)}
html.wv-dark .dz-blob,html.wv-dark .dz-blob2{opacity:.16}
.dz-ring{color:var(--accent-2);opacity:.6}
.dz-dots{color:var(--accent);opacity:.38;height:var(--s)}
.dz-squiggle{color:var(--c-board);opacity:.55;height:calc(var(--s) * .3)}
.dz-plus{color:var(--accent-2);opacity:.7}
.dz-circle{color:var(--c-board);opacity:.65}
.dz-tri{color:var(--accent);opacity:.55}
.dz-spark{color:var(--c-folder);opacity:.85}
.dz-arc{color:var(--accent);opacity:.3;height:calc(var(--s) * .6)}
.dp-tr{top:-150px;right:-150px}.dp-bl{bottom:-150px;left:-130px}.dp-l{top:44%;left:-60px}.dp-br{bottom:30px;right:24px}.dp-tl{top:58%;left:18px}
.dp-r{top:36%;right:2.6%}.dp-b{bottom:7%;left:34%}.dp-t{top:30%;left:2.6%}.dp-rb{bottom:22%;right:5%}.dp-r2{top:66%;right:2%}.dp-l2{top:22%;left:2%}.dp-bm{bottom:-30px;left:62%}.dp-l3{top:82%;left:4%}

/* ---- Home hero ---- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:34px 36px 30px;background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 16%,var(--panel)),color-mix(in srgb,var(--accent-2) 13%,var(--panel)));border:1px solid color-mix(in srgb,var(--accent) 18%,var(--line));box-shadow:var(--shadow)}
.hero-txt{position:relative;z-index:1;max-width:620px}
.hero-kick{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.hero .hello{font-size:clamp(32px,4.8vw,48px);margin:8px 0 18px}
.hello-name{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-acts{display:flex;flex-wrap:wrap;gap:8px}
.hero-acts .btn{height:38px;border-radius:10px}
.hero-shapes{position:absolute;inset:0;pointer-events:none}
.hs{position:absolute;display:block;border-radius:50%}
.hs1{width:220px;height:220px;right:-50px;top:-70px;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--accent) 55%,transparent),transparent 70%);animation:wv-float 7s ease-in-out infinite}
.hs2{width:120px;height:120px;right:150px;bottom:-50px;border:10px solid color-mix(in srgb,var(--accent-2) 45%,transparent);animation:wv-float 6s ease-in-out infinite reverse}
.hs3{width:18px;height:18px;right:260px;top:38px;background:var(--accent-2);opacity:.7;animation:wv-float 4s ease-in-out infinite}
.hs4{width:64px;height:64px;right:60px;bottom:30px;border-radius:16px;background:color-mix(in srgb,var(--c-board) 35%,transparent);transform:rotate(18deg);animation:wv-spin 18s linear infinite}
.hs5{width:10px;height:10px;right:330px;bottom:40px;background:var(--accent);opacity:.6;animation:wv-float 5s ease-in-out infinite}
@keyframes wv-spin{to{transform:rotate(378deg)}}
.hero + .hello-sub{margin:14px 4px 0}
@media (max-width:640px){ .hero{padding:24px 20px} .hs2,.hs3,.hs5{display:none} }

/* ---- Save indicator + profile chip ---- */
.save-pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:500 11.5px var(--f-ui);color:var(--muted);background:var(--hover);white-space:nowrap;transition:background .2s,color .2s}
.save-pill .ic{width:13px;height:13px}
.save-pill[data-s="synced"],.save-pill[data-s="local"]{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.save-pill[data-s="synced"] .ic,.save-pill[data-s="local"] .ic{animation:wv-check .4s cubic-bezier(.2,.9,.25,1.6)}
.save-pill[data-s="offline"],.save-pill[data-s="error"],.save-pill[data-s="queued"]{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.spin{width:11px;height:11px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:wv-rot .7s linear infinite;display:inline-block}
@keyframes wv-rot{to{transform:rotate(360deg)}}
@media (max-width:640px){ .save-pill span{display:none} }
.me-chip{display:flex;align-items:center;gap:10px;margin:8px 0 2px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left;transition:border-color .15s,transform .15s}
.me-chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.me-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.me-t b{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-t small{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-chip > .ic{width:14px;height:14px;color:var(--faint)}
.av{border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center}
.av-i{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-weight:700;font-family:var(--f-display)}
.sync{display:none}

/* ---- Profile ---- */
.prof{width:min(620px,100%);gap:16px}
.prof-head{display:flex;gap:16px;align-items:flex-start}
.prof-av{flex:none}
.prof-id{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.prof-id small{color:var(--faint);font-size:12px}
.prof-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.prof-stats div{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column}
.prof-stats b{font:700 22px var(--f-display);color:var(--accent)}
.prof-stats span{font-size:12px;color:var(--muted)}
.prof-sec{display:flex;flex-direction:column;gap:8px}
.prof-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.prof-row small{display:block;color:var(--faint);font-size:11.5px}
.acc-row{display:flex;gap:8px}
.acc{width:28px;height:28px;border-radius:50%;background:var(--c);border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line-2);transition:transform .15s}
.acc:hover{transform:scale(1.12)}
.acc.on{box-shadow:0 0 0 2px var(--c)}
.switch{position:relative;width:42px;height:24px;flex:none;cursor:pointer}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--line-2);transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.2,.9,.25,1.4)}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(18px)}
.switch input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.prof-safe{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--ok) 9%,transparent);border:1px solid color-mix(in srgb,var(--ok) 25%,transparent)}
.safe-ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--ok);color:#fff}
.prof-safe b{display:block;font-size:13.5px}
.prof-safe small{color:var(--muted);font-size:12px}
.prof-btns{display:flex;gap:8px;flex-wrap:wrap}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;font-size:12.5px;color:var(--muted)}
.keys div{display:flex;align-items:center;gap:8px}
.keys kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--fg);background:var(--bg);min-width:28px;text-align:center}
@media (max-width:560px){ .prof-stats{grid-template-columns:repeat(2,minmax(0,1fr))} .keys{grid-template-columns:minmax(0,1fr)} }

/* ---- Search ---- */
.sx-box{display:flex;align-items:center;gap:10px;margin:18px 0 12px;padding:0 16px;height:54px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.sx-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
.sx-box > .ic{width:20px;height:20px;color:var(--accent)}
.sx-box input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:17px}
.sx-count{font:12px var(--f-mono);color:var(--faint)}
.sx-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sx-f{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--muted)}
.sx-f .ic{width:14px;height:14px}
.sx-f em{font:600 10.5px var(--f-mono);font-style:normal;color:var(--faint)}
.sx-f.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.sx-f.on em{color:inherit;opacity:.8}
.sx-results{display:flex;flex-direction:column;gap:6px}
.sx-h{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:4px 2px}
.sx-r{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);animation:wv-rise .3s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--i),12) * 20ms);transition:border-color .15s,transform .15s}
.sx-r:hover,.sx-r.on{border-color:var(--tc);transform:translateX(3px)}
.sx-ic{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc)}
.sx-body{display:flex;flex-direction:column;gap:2px;min-width:0}
.sx-body b{font-weight:600;font-size:14.5px}
.sx-body small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.sx-body mark{background:color-mix(in srgb,var(--accent-2) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.sx-path{font:11px var(--f-mono);color:var(--faint)}

/* ---- Folders ---- */
.fd-head{display:flex;align-items:center;gap:14px}
.fd-ic{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c-folder) 18%,transparent);color:var(--c-folder)}
.fd-ic .ic{width:28px;height:28px}
.fd-meta{margin:12px 0 14px}
.fd-new{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:18px;font-size:12.5px;color:var(--muted)}
.fd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fd-card{animation:wv-rise .35s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--i),14) * 25ms)}
.fd-card.t-folder{background:linear-gradient(160deg,color-mix(in srgb,var(--c-folder) 10%,var(--panel)),var(--panel))}
.fd-card.drop{border-color:var(--c-folder);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-folder) 30%,transparent);transform:scale(1.02)}

/* ---- Drawings: move & size bar ---- */
.sk-bar{gap:4px;padding:5px}
.sk-bar .sk-move{background:transparent;color:var(--muted);cursor:grab;padding:0 6px;height:28px}
.sk-bar .sk-move:active{cursor:grabbing}
.sk-name{padding-left:2px}
.sk-seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sk-seg button{height:26px;min-width:28px;padding:0 6px;border-radius:0;background:transparent;color:var(--fg);font-size:12px}
.sk-seg button:hover{background:var(--hover)}
.sk-bar .sk-edit{background:var(--accent);color:var(--accent-fg)}
.sk-bar .sk-open{background:var(--hover);color:var(--fg);padding:0 8px}
.sk-bar button + button{background:none}
.sk-bar .sk-edit{background:var(--accent)!important;color:var(--accent-fg)!important}
.sk-bar .sk-open{background:var(--hover)!important}
.blk-ghost{position:fixed;left:0;top:0;z-index:99;width:120px;max-height:90px;border-radius:10px;overflow:hidden;background:var(--panel);border:2px solid var(--accent);box-shadow:var(--shadow);pointer-events:none;display:grid;place-items:center;padding:6px;color:var(--accent)}
.blk-ghost img{max-width:100%;max-height:76px;display:block}
.blk-line{position:absolute;z-index:7;height:4px;border-radius:4px;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);pointer-events:none}
.blk-dragging{opacity:.35}

/* ---- Signature art: static vector compositions in the four brand colors ---- */
.view-deco .sig{position:absolute;color:var(--fg);pointer-events:none}
.sig-svg{display:block;width:100%;height:100%;overflow:visible}
.sig-tr{top:0;right:0;width:min(440px,34vw);aspect-ratio:1}
.sig-bl{bottom:0;left:0;width:min(380px,30vw);aspect-ratio:1}
.sig-l{left:0;top:38%;width:62px;height:150px}
.sig-r{right:10px;top:46%;width:62px;height:166px}
html.wv-dark .view-deco .sig{opacity:.9}
@media (max-width:820px){ .sig-l,.sig-r{display:none} .sig-tr{width:220px} .sig-bl{width:200px} }
body{background:var(--bg)}
.main{background:var(--bg)}
/* hero: clean card with the signature illustration on the right */
.hero{background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 2px rgba(18,22,58,.04),0 14px 34px rgba(18,22,58,.07);padding:36px 40px 32px;min-height:220px}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--brand-blue) 0 25%,var(--brand-yellow) 25% 50%,var(--brand-green) 50% 75%,var(--brand-amber) 75% 100%)}
.hero-art{position:absolute;right:18px;top:50%;transform:translateY(-50%);width:min(380px,44%);height:calc(100% - 24px);color:var(--fg);pointer-events:none}
.hero-txt{max-width:56%}
.hero-kick{color:var(--brand-amber)}
html.wv-dark .hero-kick{color:var(--brand-yellow)}
.hello-name{background:none;color:var(--accent);-webkit-text-fill-color:currentColor}
@media (max-width:760px){ .hero-art{opacity:.25;width:70%} .hero-txt{max-width:none} }
/* logo in the palette */
.logo-wrap{background:var(--brand-blue);box-shadow:none;position:relative}
.logo-wrap::after{content:"";position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--brand-yellow);border:2px solid var(--panel)}
.logo-wrap .logo{color:#fff}
/* everything decorative stays still */
.hs,.empty-state > .ic,.tp-streak.lit .flame .ic,.sheet,.tpl-strip{animation:none!important}
.btn.primary{background:var(--accent);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 25%,transparent)}
.btn.primary::after{display:none}
.read-progress i{background:linear-gradient(90deg,var(--brand-blue),var(--brand-green))}
.tp-streak.lit .flame{background:color-mix(in srgb,var(--brand-yellow) 35%,transparent);color:var(--brand-amber)}
.tp-week i.on{background:var(--brand-green);color:#06301b;animation:none}
.ring-fg{stroke:var(--brand-green)}
.sx-body mark,.md mark{background:color-mix(in srgb,var(--brand-yellow) 65%,transparent)}
.av-i{background:var(--brand-blue)}
.nav a::before{background:var(--brand-amber)}

/* Word-style note editor */
.note-wrap{height:100%;overflow-y:auto;overflow-x:hidden;background:transparent}
.ribbon{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.ribbon button{height:30px;min-width:30px;padding:0 6px;border-radius:6px;display:inline-grid;place-items:center;font-size:15px;color:var(--fg)}
.ribbon button:hover{background:var(--hover)}
.ribbon button.on{background:var(--accent-soft);color:var(--accent)}
.ribbon .ic{width:17px;height:17px}
.ribbon select{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:0 6px;font-size:13px;max-width:132px;outline:none}
.ribbon select:focus{border-color:var(--accent)}
.rsep{width:1px;height:20px;background:var(--line);margin:0 4px}
.ribbon .rfont{display:inline-flex;align-items:center;gap:4px;max-width:160px;border:1px solid var(--line);padding:0 8px;font-size:13px}
.rfont span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rfont .ic{width:13px;height:13px;flex:none}
.ribbon .rcolor{position:relative}
.ca{font-weight:700;font-size:15px;line-height:1;margin-top:-4px}
.cbar{position:absolute;left:7px;right:7px;bottom:4px;height:3px;border-radius:2px}
.cpop{padding:4px 6px 8px}
.cgrid{display:grid;grid-template-columns:repeat(5,26px);gap:6px;padding:4px 4px 0}
.csw{width:26px;height:26px;border-radius:6px;border:1px solid var(--line-2)}
.csw:hover{transform:scale(1.12)}
.csw.none{background:linear-gradient(135deg,transparent 44%,var(--danger) 44% 56%,transparent 56%),var(--panel)}
.paper{max-width:860px;margin:28px auto 120px;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:56px 76px 72px;min-height:calc(100% - 90px)}
.paper .page-title{font-family:var(--note-head,var(--f-display))}
.rt{outline:none;max-width:none;min-height:55vh;position:relative;font-family:var(--note-body,var(--f-ui));line-height:1.7;caret-color:var(--accent)}
