.rt.empty::before{content:attr(data-ph);position:absolute;left:0;top:0;color:var(--faint);pointer-events:none}
.rt p{margin:0 0 .55em}
.rt img{max-width:100%;height:auto;border-radius:6px;border:1px solid var(--line);margin:6px 0;background:#fff;display:inline-block}
.rt img:hover{outline:2px solid var(--accent-soft)}
.rt table{border-collapse:collapse;width:100%;margin:.6em 0;table-layout:fixed}
.rt td,.rt th{border:1px solid var(--line-2);padding:6px 9px;vertical-align:top;min-width:40px}
.rt th{background:var(--hover);font-weight:600;text-align:left}
.rt ul.todo-list{list-style:none;padding-left:2px}
.rt ul.todo-list > li{position:relative;padding-left:30px}
.rt ul.todo-list > li::before{content:"";position:absolute;left:2px;top:.32em;width:16px;height:16px;border:1.5px solid var(--line-2);border-radius:4px;background:var(--panel);cursor:pointer;box-sizing:border-box;font:700 11px/13px var(--f-ui);text-align:center;color:var(--accent-fg);transition:background .15s,border-color .15s,transform .15s}
.rt ul.todo-list > li:hover::before{border-color:var(--accent)}
.rt ul.todo-list > li[data-done="true"]::before{content:"✓";background:var(--accent);border-color:var(--accent)}
.rt ul.todo-list > li[data-done="true"]{color:var(--faint);text-decoration:line-through}
.rt a{color:var(--accent);cursor:pointer}
.rt a.wikilink{cursor:pointer;user-select:all}
.rt blockquote{margin:0 0 .8em}
@media (max-width: 640px){ .paper{margin:0;border-radius:0;border-left:0;border-right:0;padding:26px 18px 80px;min-height:100%} }

/* Canvas quick actions, AI, images */
.st-quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:4px;border-bottom:1px solid var(--line);padding-bottom:10px}
.sq{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:7px;background:var(--hover);font-size:11.5px;color:var(--muted)}
.sq:hover{background:var(--accent-soft);color:var(--accent)}
.sq.spark,.tool.spark{color:var(--c-canvas)}
.spark-pop{padding:4px 6px 8px;width:300px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;gap:8px}
.spark-pop .pop-h{padding:6px 2px 0}
.spark-pop input{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:8px 10px;outline:none}
.spark-pop input:focus{border-color:var(--accent)}
.spark-pop .row{display:flex;justify-content:flex-end}
.spark-pop p{margin:0;font-size:12px;color:var(--faint)}
.spark-pop kbd,.cv-hint kbd{font:500 10.5px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--fg)}
.md-img{display:block;max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);margin:8px 0;background:#fff}

/* Motion: quick, eased, and off for reduced-motion */
@keyframes wv-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes wv-pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
@keyframes wv-fade{from{opacity:0}to{opacity:1}}
@keyframes wv-toast{from{opacity:0;transform:translate(-50%,14px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes wv-rise{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.view > *{animation:wv-in .32s cubic-bezier(.2,.8,.2,1)}
.pop,.ac{animation:wv-pop .16s cubic-bezier(.2,.8,.2,1);transform-origin:top left}
.palette,.modal,.fp{animation:wv-fade .18s ease-out}
.pal,.mc,.fp-box{animation:wv-pop .26s cubic-bezier(.2,.9,.25,1.12)}
.cv-style{animation:wv-pop .2s cubic-bezier(.2,.9,.25,1.12);transform-origin:top left}
.toast{animation:wv-toast .3s cubic-bezier(.2,.9,.25,1.2)}
.rc,.q,.task-row{animation:wv-rise .4s cubic-bezier(.2,.8,.2,1) both}
.recent .rc:nth-child(2){animation-delay:.03s}.recent .rc:nth-child(3){animation-delay:.06s}.recent .rc:nth-child(4){animation-delay:.09s}.recent .rc:nth-child(5){animation-delay:.12s}.recent .rc:nth-child(6){animation-delay:.15s}
.card{transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rc,.q{transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s}
.rc:hover,.q:hover{transform:translateY(-3px)}
.tool,.btn,.mini,.icon-btn,.chip-btn,.sq,.opt,.sw,.fp-cat,.pi,.tree-row,.nav a{transition:background .14s,color .14s,transform .12s,box-shadow .14s}
.tool:active,.btn:active,.mini:active,.icon-btn:active,.sq:active,.opt:active,.sw:active{transform:scale(.93)}
.sw:hover{transform:scale(1.12)}
.md-img{animation:wv-in .35s cubic-bezier(.2,.8,.2,1)}

@media (max-width: 1100px){ .cv-hint{display:none} }
@media (max-width: 820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-104%);transition:transform .2s ease;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px))}
  .app.drawer .sidebar{transform:none;box-shadow:var(--shadow)}
  .app.drawer .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:39}
  .only-mobile{display:grid!important}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .recent{grid-template-columns:repeat(2,minmax(0,1fr))}
  .home-cols{grid-template-columns:minmax(0,1fr)}
  .row-acts{display:flex}
}
@media (max-width: 640px){
  .cv-tools{top:auto;bottom:max(12px,env(safe-area-inset-bottom,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));max-width:none}
  .hf-boxes{grid-template-columns:minmax(0,1fr)} .hf-box:nth-child(n) span,.hf-box:nth-child(n) textarea{text-align:left}
  .cv-zoom{bottom:auto;top:58px}
  .cv-title{width:calc(100% - 24px)}
  .cv-style{top:auto;bottom:66px;left:12px;right:12px;width:auto;max-height:42%}
  .mc-grid{grid-template-columns:minmax(0,1fr)}
  .three{grid-template-columns:minmax(0,1fr)}
  .doc,.home-in{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
  .board-page .page-head,.board{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .col{flex-basis:min(290px,82vw)}
  .crumbs a{display:none} .crumbs .sep{display:none}
}
@media (max-width: 480px){ .recent{grid-template-columns:minmax(0,1fr)} .chip-btn .lbl{display:none} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
/* ==== halt.ae design system: notes first, neat 8px grid, forest + lime ==== */
:root{
  --bg:#F3F6EC; --panel:#FFFFFF; --side:#FAFBF6; --fg:#0E2A1C; --muted:#4F6357; --faint:#8C9B91;
  --line:#E1E7D6; --line-2:#CBD5BD; --hover:rgba(14,42,28,.05);
  --accent:#0F3B26; --accent-fg:#E2F79B; --accent-soft:#EAF7C3; --accent-2:#B85E00;
  --lime:#D9F26C; --signal:#1DBF6E; --hero-bg:#E3F3A6;
  --c-note:#16A361; --c-canvas:#B85E00; --c-board:#0024CC; --c-folder:#B38F00;
  --t0:#16A361; --t1:#B85E00; --t2:#0024CC; --t3:#8C7400; --t4:#0F3B26; --t5:#C2255C;
  --canvas-bg:#FAFBF6; --canvas-dot:#D7DECB; --mark:#E8F79A;
  --shadow:0 1px 2px rgba(14,42,28,.05),0 6px 18px rgba(14,42,28,.06);
  --f-display:"Outfit","Segoe UI",system-ui,sans-serif;
  --f-ui:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --r:12px;
}
html.wv-dark{
  --bg:#09130D; --panel:#0F1C14; --side:#0C1711; --fg:#E7F1E9; --muted:#9DB0A4; --faint:#66786C;
  --line:#1C2E23; --line-2:#2A4334; --hover:rgba(231,241,233,.06);
  --accent:#D4F25E; --accent-fg:#0A1F12; --accent-soft:#1B3520; --accent-2:#FF9A2E;
  --lime:#D4F25E; --signal:#3BE08A; --hero-bg:#13261A;
  --c-note:#3BE08A; --c-canvas:#FF9A2E; --c-board:#8098FF; --c-folder:#FFE14D;
  --t0:#3BE08A; --t1:#FF9A2E; --t2:#8098FF; --t3:#FFE14D; --t4:#D4F25E; --t5:#FF7FAF;
  --canvas-bg:#0A150F; --canvas-dot:#1D3024; --mark:#3D4A12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
}
body{background:var(--bg);font-family:var(--f-ui);letter-spacing:-.005em}
.app{padding:8px;gap:8px}
.sidebar,.main{border-radius:16px;box-shadow:none;border:1px solid var(--line)}
.sidebar{background:var(--side)}
.main{background:var(--bg)}
.topbar{height:52px;background:var(--bg);backdrop-filter:none;border-bottom:1px solid var(--line)}
/* brand */
.brand{padding:6px 8px 14px;gap:0}
.brand-word{display:inline-flex;align-items:flex-end;font:800 24px/1 var(--f-display);letter-spacing:-.04em;color:var(--fg)}
.rope-t{height:31px;width:auto;margin:0 -1px -1px 0;filter:drop-shadow(0 1px 0 rgba(0,0,0,.08))}
html.wv-dark .brand-word{color:var(--lime)}
/* sidebar: tidy, aligned rows */
.search-btn{height:36px;border-radius:10px;background:var(--panel)}
.search-btn:hover{border-color:var(--fg);box-shadow:none}
.search-btn kbd{border-radius:6px}
.nav{gap:2px}
.nav a{height:34px;padding:0 10px;border-radius:9px;font-weight:500}
.nav a:hover{transform:none;background:var(--hover)}
.nav a.on{background:var(--accent);color:var(--accent-fg)}
.nav a.on .ic{color:var(--accent-fg)}
.nav a::before{display:none}
.tree-row{min-height:32px;border-radius:9px}
.tree-row.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--signal)}
.sb-head{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em}
.sb-new{gap:6px;padding-top:10px}
.sb-new button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 2px;font-weight:500}
.sb-new button:hover{border-color:var(--fg)}
.me-chip{border-radius:12px;background:var(--panel)}
.me-chip:hover{border-color:var(--fg);transform:none}
.av-i{background:var(--accent);color:var(--accent-fg)}
/* buttons: crisp, consistent */
.btn{height:34px;border-radius:10px;border-color:var(--line-2);font-weight:600}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:none}
.btn.primary:hover{transform:none;filter:brightness(1.12)}
.save-pill{border-radius:8px;font-weight:600}
/* decoration: small logo marks only, never on notes or canvases */
.view-deco .mk{position:absolute;display:block;opacity:.55}
.view-deco .m-svg{display:block;width:100%;height:100%}
.mk-tr{top:18px;right:22px;width:46px;height:46px}
.mk-r{top:52%;right:16px;width:28px;height:28px}
.mk-bl{bottom:20px;left:20px;width:44px;height:38px}
.mk-l{top:34%;left:14px;width:26px;height:26px}
.mk-b{bottom:18px;right:24%;width:60px;height:36px}
.view[data-kind="home"] .view-deco,.view[data-kind="note"] .view-deco,.view[data-kind="canvas"] .view-deco,.view[data-kind="graph"] .view-deco,.view[data-kind="board"] .view-deco{display:none}
@media (max-width:820px){ .view-deco{display:none} }
/* home: hero + notes first */
.home-in{max-width:1180px;padding-block:28px 80px}
.hero{background:var(--hero-bg);border:1px solid color-mix(in srgb,var(--signal) 22%,var(--line));border-radius:18px;box-shadow:none;padding:30px 34px;min-height:0}
.hero::before{display:none}
.hero-marks{position:absolute;right:20px;top:50%;transform:translateY(-50%);width:min(380px,40%);pointer-events:none}
.hm-svg{display:block;width:100%;height:auto}
html.wv-dark .hero-marks{opacity:.85}
.hero-txt{position:relative;z-index:1;max-width:58%}
.hero-kick{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero .hello{font:800 clamp(30px,4vw,44px)/1.05 var(--f-display);letter-spacing:-.035em;margin:8px 0 18px;color:var(--fg)}
.hello-name{color:var(--signal);-webkit-text-fill-color:currentColor;background:none}
html.wv-dark .hello-name{color:var(--lime)}
.capture{display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 16px;background:var(--panel);border:1.5px solid var(--fg);border-radius:14px;box-shadow:4px 4px 0 var(--fg);transition:transform .12s,box-shadow .12s}
.capture:focus-within{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--fg)}
.cap-ic{color:var(--signal);display:grid}
.cap-ic .ic{width:20px;height:20px}
.capture input{flex:1;min-width:0;border:0;outline:none;background:none;font:500 16px var(--f-ui)}
.capture kbd{font:600 11px var(--f-mono);color:var(--muted);border:1px solid var(--line-2);border-radius:7px;padding:4px 8px}
.hero-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip-a{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--fg) 18%,transparent);background:color-mix(in srgb,var(--panel) 70%,transparent);font:600 12.5px var(--f-ui);color:var(--fg);transition:background .12s,border-color .12s}
.chip-a:hover{background:var(--panel);border-color:var(--fg)}
.chip-a .ic{width:15px;height:15px}
.hero + .hello-sub,.hello-sub{display:none}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;margin-top:28px;align-items:start}
.sect-h{align-items:center;margin-bottom:14px}
.sect-h h2{font:800 20px var(--f-display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.sect-h h2 em{font:600 11px var(--f-mono);font-style:normal;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.sect-h.sm{margin-top:30px}
.sect-link{display:inline-flex;align-items:center;gap:4px;font:600 12.5px var(--f-ui);color:var(--muted);text-decoration:none}
.sect-link:hover{color:var(--fg)}
.sect-link .ic{width:14px;height:14px}
.note-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.note-card{display:flex;flex-direction:column;gap:8px;min-height:176px;padding:16px 16px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);text-decoration:none;color:var(--fg);transition:border-color .15s,transform .15s,box-shadow .15s}
.note-card:hover{border-color:var(--fg);transform:translateY(-2px);box-shadow:4px 4px 0 var(--fg)}
.note-card.pinned{border-color:color-mix(in srgb,var(--signal) 45%,var(--line))}
.nc-top{display:flex;align-items:flex-start;gap:8px}
.nc-title{flex:1;min-width:0;font:700 16px/1.25 var(--f-display);letter-spacing:-.015em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc-pin{color:var(--signal)}
.nc-pin .ic{width:15px;height:15px;fill:currentColor}
.nc-prev{flex:1;margin:0;color:var(--muted);font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nc-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:500 11px var(--f-mono);color:var(--faint);padding-top:10px;border-top:1px dashed var(--line)}
.nc-tag{color:var(--fg);background:var(--accent-soft);border-radius:6px;padding:1px 6px}
.mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-decoration:none;color:var(--fg);min-width:0}
.mini:hover{border-color:var(--fg)}
.mini-ic{width:30px;height:30px;flex:none;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc)}
.mini-t{flex:1;min-width:0;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini em{font:11px var(--f-mono);font-style:normal;color:var(--faint)}
.rail{display:flex;flex-direction:column;gap:12px}
.rail .today-panel{grid-template-columns:minmax(0,1fr);margin:0;gap:12px}
.rail .tp-streak{flex-wrap:wrap}
.rail .tp-week{margin-left:0;width:100%;justify-content:space-between}
.rail-card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:14px 16px}
.rail-h{display:flex;align-items:center;justify-content:space-between;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.rail-h em{font-style:normal;color:var(--fg)}
.rail .task-row{padding:8px 0}
.rail .task-row:first-of-type{border-top:0}
.rail .task-row:last-child{border-bottom:0}
.tp-streak,.tp-today{border-radius:var(--r)}
.tp-streak.lit .flame{background:var(--accent-soft);color:var(--accent-2)}
.tp-week i.on{background:var(--signal);color:#06301B}
.ring-fg{stroke:var(--signal)}
.rc,.q{border-radius:var(--r)}
@media (max-width:1100px){ .home-grid{grid-template-columns:minmax(0,1fr)} .note-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){ .note-grid,.mini-grid{grid-template-columns:minmax(0,1fr)} .hero{padding:22px 18px} .hero-marks{display:none} .hero-txt{max-width:none} }
/* notes editor: calm, compact toolbar, the page is the focus */
.ribbon{padding-block:6px;gap:0;border-bottom:1px solid var(--line);background:var(--panel)}
.rgroup{padding:0 4px}
.ribbon .rb{min-width:46px;height:46px;border-radius:9px;gap:2px}
.ribbon .rb .ic{width:18px;height:18px}
.ribbon .rb span{font:500 10.5px var(--f-ui);letter-spacing:0}
.ribbon .rb.on{background:var(--accent-soft);color:var(--fg)}
.ribbon .rb .cbar{top:27px}
.read-progress{top:59px}
.read-progress i{background:var(--signal)}
.paper:not(.paged){border-radius:14px;box-shadow:var(--shadow)}
.sheet{border-radius:6px;border-color:var(--line);box-shadow:0 1px 2px rgba(14,42,28,.05),0 10px 30px rgba(14,42,28,.07)}
.page-title{font-family:var(--f-display);font-weight:800;letter-spacing:-.035em}
.md h1,.md h2,.md h3{font-family:var(--note-head,var(--f-display));font-weight:700;letter-spacing:-.02em}
.wikilink{color:var(--fg);border-bottom:2px solid var(--signal)}
.md mark,.sx-body mark{background:var(--lime)}
.rt blockquote.callout{background:var(--accent-soft)}
.rt blockquote.callout::before{background:var(--signal)}
.to-top{background:var(--accent);color:var(--accent-fg);box-shadow:var(--shadow)}
.tpl-chip:hover,.tpl-card:hover{border-color:var(--fg)}
.tpl-card:hover{box-shadow:4px 4px 0 var(--fg)}
.sk-bar .sk-edit{background:var(--accent)!important;color:var(--accent-fg)!important}
/* tidy cards elsewhere */
.col{border-radius:var(--r)}
.card{border-radius:10px}
.card:hover{box-shadow:3px 3px 0 var(--fg);transform:translateY(-1px)}
.sx-box{border-radius:14px;border:1.5px solid var(--fg);box-shadow:4px 4px 0 var(--fg)}
.sx-box:focus-within{box-shadow:5px 5px 0 var(--fg);border-color:var(--fg)}
.sx-f.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cal-cell.today{border-color:var(--signal);box-shadow:0 0 0 2px color-mix(in srgb,var(--signal) 25%,transparent)}
.cal-cell.today .cal-d span{background:var(--signal);color:#06301B}
.modal .mc,.pal,.fp-box{border-radius:16px}
.toast{border-radius:12px}
.empty-state > .ic{color:var(--signal)}

/* ==== Datum-style shell: square, hairline, dense, mono labels — in halt.ae colors ==== */
:root{
  --bg:#F2F4EE; --panel:#F8F9F5; --paper:#FFFFFF; --side:#F5F6F1; --fg:#0E2A1C; --muted:#4D5E54; --faint:#7E8C84;
  --line:#D3D9D0; --line-2:#BCC5B9; --line-3:#E5E9E2; --hover:rgba(14,42,28,.055);
  --accent:#0F3B26; --accent-fg:#DDF58A; --accent-soft:#E7F2D3; --sel:#DDEFC6; --signal:#16A361; --lime:#D9F26C;
  --f-ui:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",Consolas,ui-monospace,monospace; --f-display:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --r:0px; --shadow:0 0 0 transparent;
}
html.wv-dark{
  --bg:#0C1510; --panel:#111C16; --paper:#15211A; --side:#0F1913; --fg:#E4EEE6; --muted:#9AAEA2; --faint:#62756A;
  --line:#22342A; --line-2:#2F4639; --line-3:#1A2A21; --hover:rgba(228,238,230,.06);
  --accent:#D4F25E; --accent-fg:#0A1F12; --accent-soft:#1A3020; --sel:#22401F; --signal:#3BE08A;
}
body{font:13px/1.45 var(--f-ui);letter-spacing:0;background:var(--bg)}
.mono-l,.sb-head,.hf-label,.st-label,.rail-h,.pop-h,.slash-h,.cal-dow,.bl-head{font-family:var(--f-mono)!important;font-size:10px!important;font-weight:500!important;letter-spacing:.14em!important;text-transform:uppercase}
/* square everything */
.sidebar,.main,.btn,.chip-btn,.icon-btn,.mini,.search-btn,.card,.col,.rc,.q,.note-card,.tile,.mc,.pal,.fp-box,.pop,.ac,.slash,.toast,.modal .mc,.sx-box,.sx-r,.sx-f,.cal-cell,.cal-chip,.trash-row,.tpl-card,.tpl-chip,.hist-prev,.hist-i,.fld input,.fld select,.fld textarea,.bt-wrap,.bt-in,.capture,.chip-a,.me-chip,.save-pill,.seg,.seg button,.img-bar,.sk-frame,.sk-bar,.cv-tools,.cv-style,.cv-zoom,.cv-title,.cv-hint,.graph-panel,.tp-streak,.tp-today,.rail-card,.mini-ic,.sx-ic,.tpl-ic,.fd-ic,.flame,.tp-week i,.composer,.add-col,.add-row,.ribbon select,.rfont,.paper:not(.paged),.sheet,.hero,.rgroup,.opt,.sw,.acc,.csw,.font-pick,.fp-cat,.fp-search,.fp-sample,.hf-temp,.ht-mini,.hf-box textarea,.prof-stats div,.prof-safe,.safe-ic,.blk-ghost,.pres-bar,.pb,.tool,.sq,.nc-tag,.chip,.tag,.kbd,kbd{border-radius:0!important}
.ribbon .rb,.tool,.pi,.slash-i,.ac-i,.pal-item,.tree-row,.nav a,.mini,.sq{border-radius:3px!important}
.note-card:hover,.tpl-card:hover,.card:hover,.capture,.capture:focus-within,.sx-box,.sx-box:focus-within,.rc:hover,.q:hover{box-shadow:none!important;transform:none!important}
.modal .mc,.pal,.fp-box,.pop,.slash,.ac{box-shadow:0 18px 50px rgba(14,42,28,.18)}
/* app shell: rail | navigator | main */
.app{grid-template-columns:64px 252px minmax(0,1fr);padding:0;gap:0;height:100%}
.rail{display:flex;flex-direction:column;align-items:stretch;background:var(--accent);padding:6px 0;overflow-y:auto;scrollbar-width:none}
html.wv-dark .rail{background:#0A1A10;border-right:1px solid var(--line)}
.ri{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:58px;margin:0 6px 2px;color:color-mix(in srgb,var(--accent-fg) 82%,transparent);text-decoration:none;font:500 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;border-radius:3px;position:relative;transition:background .12s,color .12s}
html.wv-dark .ri{color:#B9CDBF}
.ri .ic{width:20px;height:20px}
.ri:hover{background:rgba(255,255,255,.09);color:#fff}
.ri.on{background:rgba(255,255,255,.14);color:#fff}
.ri.on::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:3px;background:var(--lime)}
.ri-grow{flex:1}
.ri-logo{height:52px;display:grid;place-items:center;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.12)}
.ri-logo img{height:30px}
.sidebar{border:0;border-right:1px solid var(--line);background:var(--side);padding:10px 8px 8px}
.main{border:0;background:var(--bg)}
.sidebar .nav,.sidebar .sb-foot,.sidebar .me-chip,.sidebar .sync{display:none}
.brand{padding:4px 8px 12px;border-bottom:1px solid var(--line-3);margin:0 -8px 10px;padding-left:16px}
.brand-word{font-size:21px}
.brand{display:flex;align-items:flex-end;gap:10px}
.brand-app{font:500 9.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:0 0 4px 10px;border-left:1px solid var(--line-2)}
.rope-t{height:27px}
.search-btn{height:30px;border-color:var(--line);background:var(--paper);font-size:12.5px}
.search-btn kbd{font:500 10px var(--f-mono);border:1px solid var(--line)}
.sb-head{padding:12px 8px 4px;color:var(--faint)}
.tree-row{min-height:28px}
.tree-row.on{background:var(--sel);box-shadow:inset 2px 0 0 var(--signal)}
.tree-link{padding:4px 4px;font-size:12.5px}
.sb-new{gap:4px;border-top:1px solid var(--line-3)}
.sb-new button{border:1px solid var(--line);background:var(--paper);padding:7px 2px;font:500 9.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sb-new button:hover{border-color:var(--fg);color:var(--fg);background:var(--paper)}
/* title bar */
.topbar{height:40px;background:var(--panel);border-bottom:1px solid var(--line);gap:10px}
.crumbs{font-size:12.5px}
.crumbs .cur{font-weight:600}
.tellme{display:inline-flex;align-items:center;gap:8px;height:28px;min-width:260px;padding:0 6px 0 10px;border:1px solid var(--line);background:var(--paper);color:var(--faint);font-size:12px;cursor:text}
.tellme:hover{border-color:var(--line-2);color:var(--muted)}
.tellme .ic{width:14px;height:14px}
.tellme span{flex:1;text-align:left}
.tellme kbd{font:500 10px var(--f-mono);border:1px solid var(--line);padding:1px 5px;color:var(--muted)}
.save-pill{height:24px;font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.chip-btn{height:28px;font-size:12px}
.present-btn{background:var(--accent);color:var(--accent-fg)}
/* status bar */
.main{display:flex;flex-direction:column}
.statusbar{flex:none;display:flex;align-items:center;gap:14px;height:24px;padding:0 12px;border-top:1px solid var(--line);background:var(--panel);font:400 11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden}
.statusbar .st-dot{width:7px;height:7px;background:var(--signal);display:inline-block;margin-right:6px}
.statusbar [data-s="saving"] .st-dot{background:#D89A00}.statusbar [data-s="offline"] .st-dot,.statusbar [data-s="error"] .st-dot,.statusbar [data-s="queued"] .st-dot{background:#C0392B}
.statusbar .st-grow{flex:1}
.statusbar .st-sep{color:var(--line-2)}
/* buttons: mono uppercase like Datum */
.btn{height:30px;padding:0 12px;border:1px solid var(--muted);background:var(--paper);font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg)}
.btn:hover{border-color:var(--fg);background:var(--paper)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.sm{height:26px;font-size:10px}
.btn .ic{width:14px;height:14px}
/* ribbon: groups with labels underneath */
.ribbon{background:var(--panel);border-bottom:1px solid var(--line);padding:4px 6px 2px;align-items:stretch}
.rgroup{position:relative;padding:0 6px 16px;border-right:1px solid var(--line-3);align-items:flex-start}
.rgroup::after{content:attr(data-label);position:absolute;left:0;right:0;bottom:2px;text-align:center;font:500 9.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.ribbon .rb{min-width:50px;height:52px;padding:4px 6px}
.ribbon .rb span{font:400 11.5px var(--f-ui);color:var(--fg)}
.ribbon .rb:hover{background:var(--hover)}
.ribbon .rb.on{background:var(--sel);border:1px solid color-mix(in srgb,var(--signal) 40%,transparent)}
.ribbon .rb .cbar{top:30px}
.rstack select,.rrow .rfont,.rrow select{height:24px;border:1px solid var(--line);background:var(--paper);font-size:12px}
/* note desk: dotted like Datum's page area */
.note-wrap{background-color:var(--bg);background-image:radial-gradient(circle,var(--line) 1px,transparent 1.2px);background-size:18px 18px}
.sheet{border:1px solid var(--line-2);box-shadow:0 1px 0 rgba(14,42,28,.04)}
.paper:not(.paged){border:1px solid var(--line-2);box-shadow:none}
.page-title{font:700 30px/1.15 var(--note-head,var(--f-ui));letter-spacing:-.01em}
.page-meta{font:400 11px var(--f-mono)}
.md{font-size:15px}
.md h1,.md h2,.md h3{font-family:var(--note-head,var(--f-ui));font-weight:700;letter-spacing:-.01em}
.read-progress{top:63px}
.to-top{border-radius:0!important}
/* home = backstage */
.home{background:var(--bg)}
.bs{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;max-width:1500px;margin:0 auto;padding:24px 28px 60px}
.bs-hello{font:700 23px var(--f-ui);letter-spacing:-.01em;margin:6px 0 18px}
.bs-hello b{color:var(--signal)}
.bs-label{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font:500 10.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line-3);padding-bottom:6px}
.bs-label em{font-style:normal;color:var(--faint)}
.bs-label a{margin-left:auto;font:500 10px var(--f-mono);letter-spacing:.1em;color:var(--muted);text-decoration:none}
.bs-label a:hover{color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;padding:8px 8px 12px;border:1px solid var(--line);background:var(--paper);text-align:left;color:var(--fg);text-decoration:none;transition:border-color .12s,background .12s;min-width:0}
.tile:hover{border-color:var(--fg)}
.tile-well{height:64px;display:grid;place-items:center;background:var(--panel);margin-bottom:6px;color:var(--signal)}
.tile-well .ic{width:26px;height:26px}
.tile b{font-size:12.5px;padding:0 2px}
.tile small{font-size:12px;color:var(--muted);line-height:1.45;padding:0 2px}
.capture{height:40px;border:1px solid var(--line-2);box-shadow:none;background:var(--paper)}
.capture:focus-within{border-color:var(--fg)}
.capture input{font:400 13px var(--f-ui)}
.note-grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.note-card{min-height:150px;padding:12px;border-color:var(--line)}
.note-card:hover{border-color:var(--fg)}
.nc-title{font:700 13.5px/1.3 var(--f-ui)}
.nc-prev{font-size:12px}
.nc-meta{font:400 10.5px var(--f-mono);border-top:1px solid var(--line-3)}
.recent-list{border:1px solid var(--line);background:var(--paper)}
.rl-row{display:grid;grid-template-columns:22px minmax(0,1.6fr) 90px minmax(0,1fr) 90px;gap:12px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line-3);color:var(--fg);text-decoration:none;font-size:12.5px}
.rl-row:last-child{border-bottom:0}
.rl-row:hover{background:var(--sel)}
.rl-row .ic{color:var(--tc);width:15px;height:15px}
.rl-row b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl-row span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl-row em{font:400 11px var(--f-mono);font-style:normal;color:var(--faint);text-align:right}
.rl-head{background:var(--panel);font:500 9.5px var(--f-mono)!important;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)!important}
.rl-head:hover{background:var(--panel)}
.bs-side{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:12px}
.side-card{border:1px solid var(--line);background:var(--paper);padding:16px}
.side-brand{display:flex;flex-direction:column;gap:4px}
.side-logo{width:46px;height:46px;display:grid;place-items:center;background:var(--hero-bg,#E3F3A6);border:1px solid var(--line);margin-bottom:8px}
.side-logo img{height:34px}
.side-brand b{font:700 17px var(--f-ui)}
.side-brand small{color:var(--muted);font-size:12px}
.side-tag{display:inline-block;margin:8px 0 10px;padding:1px 6px;font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;background:var(--sel);border:1px solid color-mix(in srgb,var(--signal) 45%,transparent);color:var(--fg);align-self:flex-start}
.side-btns{display:grid;gap:6px;margin-top:4px}
.side-btns .btn{width:100%;justify-content:center}
.side-btns .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side-meta{margin-top:10px;font:400 11px var(--f-mono);color:var(--faint);line-height:1.6}
.bs-side .today-panel{grid-template-columns:minmax(0,1fr);gap:12px;margin:0}
.bs-side .tp-streak{flex-wrap:wrap;border-color:var(--line)}
.bs-side .tp-week{margin-left:0;width:100%;justify-content:space-between}
.bs-side .tp-today{border-color:var(--line)}
.tp-week i.on{background:var(--signal);color:#06301B}
@media (max-width:1180px){ .bs{grid-template-columns:minmax(0,1fr)} .bs-side{position:static} }
@media (max-width:820px){ .app{grid-template-columns:minmax(0,1fr)} .rail{display:none} .sidebar .nav,.sidebar .sb-foot,.sidebar .me-chip{display:flex} .tellme{min-width:0} .tellme span,.tellme kbd{display:none} .rl-row{grid-template-columns:22px minmax(0,1fr) 70px} .rl-row span,.rl-row .rl-type{display:none} .statusbar .st-ctx{display:none} }
/* misc views in the same language */
.hello{font:700 23px var(--f-ui)!important;letter-spacing:-.01em}
.hello-sub{display:block;font:400 11px var(--f-mono);color:var(--faint)}
.sx-box{border:1px solid var(--line-2);height:44px}
.sx-box:focus-within{border-color:var(--fg)}
.sx-f.on{background:var(--accent);color:var(--accent-fg)}
.cv-wrap{background:var(--canvas-bg)}
.cv-tools,.cv-style,.cv-zoom,.cv-title{box-shadow:none;border-color:var(--line-2)}
.tool .tl{font:500 9px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.board{background:transparent}
.col{background:var(--panel)}
.card{border-color:var(--line)}
.card:hover{border-color:var(--fg)}
.view-deco{display:none!important}

/* updates view */
.upd{max-width:1180px;margin:0 auto;padding:24px 28px 64px}
.upd-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.upd-id{display:flex;gap:14px;align-items:center}
.upd-id .side-logo{margin:0;width:54px;height:54px}
.upd-id .side-logo img{height:40px}
.upd-k{font:500 10.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.upd-id h1{font:700 24px/1.15 var(--f-ui);letter-spacing:-.01em;margin:3px 0 2px;color:var(--fg)}
.upd-id p{margin:0;color:var(--muted);font-size:12.5px}
.upd-facts{display:flex;margin:0;border:1px solid var(--line);background:var(--paper)}
.upd-facts div{padding:8px 14px;border-left:1px solid var(--line-3)}
.upd-facts div:first-child{border-left:0}
.upd-facts dt{font:500 9.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.upd-facts dd{margin:2px 0 0;font-size:12.5px;color:var(--fg)}
.upd-st{display:flex;align-items:flex-start;gap:14px;margin:18px 0 0;padding:14px 16px;border:1px solid var(--line);background:var(--paper)}
.upd-st>div{flex:1;min-width:0}
.upd-st>div>b{display:block;font-size:14px;color:var(--fg)}
.upd-st>div>small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.upd-ic{flex:none;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
.upd-ic .ic{width:18px;height:18px}
.upd-ic.spin .ic{animation:updSpin 1s linear infinite}
@keyframes updSpin{to{transform:rotate(360deg)}}
.upd-st.s-ok .upd-ic{color:var(--signal);background:var(--sel);border-color:color-mix(in srgb,var(--signal) 40%,transparent)}
.upd-st.s-err .upd-ic{color:var(--accent-2,#B85E00)}
.upd-st.s-new{border-color:var(--fg);box-shadow:inset 3px 0 0 var(--signal)}
.upd-st.s-new .upd-ic{color:var(--accent-fg);background:var(--accent);border-color:var(--accent)}
.upd-notes{margin:10px 0 0;padding:10px 12px;background:var(--panel);border:1px solid var(--line-3);max-height:260px;overflow:auto}
.upd-hint{margin:10px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.upd-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.upd-install{display:flex;align-items:center;gap:14px;margin-top:10px;padding:12px 16px;border:1px dashed var(--line-2);background:var(--panel)}
.upd-install>div{flex:1}
.upd-install b{display:block;font-size:13px}
.upd-install small{color:var(--muted);font-size:12px}
.upd-cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;margin-top:8px}
.rel-list{border:1px solid var(--line);background:var(--paper)}
.rel{border-bottom:1px solid var(--line-3)}
.rel:last-child{border-bottom:0}
.rel summary{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;list-style:none;font-size:13px}
.rel summary::-webkit-details-marker{display:none}
.rel summary:hover{background:var(--hover)}
.rel summary b{font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel summary em{margin-left:auto;font:400 11px var(--f-mono);font-style:normal;color:var(--faint);white-space:nowrap}
.rel-v{flex:none;min-width:48px;padding:1px 6px;font:600 11px var(--f-mono);text-align:center;border:1px solid var(--line-2);color:var(--fg)}
.rel.cur .rel-v{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.rel-tag{flex:none;padding:1px 6px;font:500 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;background:var(--sel);color:var(--fg);border:1px solid color-mix(in srgb,var(--signal) 45%,transparent)}
.rel[open] summary{border-bottom:1px dashed var(--line-3)}
.rel-sum{margin:10px 12px 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.rel>.rel-g{padding:0 12px}
.rel>.rel-g:last-child{padding-bottom:12px}
.rel-g h4{margin:10px 0 4px;font:500 9.5px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.rel-g ul{margin:0;padding:0 0 0 16px}
.rel-g li{font-size:12.5px;line-height:1.55;color:var(--fg);margin:1px 0}
.rel-g li::marker{color:var(--signal)}
.rel-g p{font-size:12.5px;margin:6px 0;color:var(--muted)}
.rel-g code,.rm code{font:400 11.5px var(--f-mono);background:var(--panel);padding:0 3px;border:1px solid var(--line-3)}
.rm{display:grid;gap:10px}
.rm-g{border:1px solid var(--line);background:var(--paper)}
.rm-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-3);font:600 12.5px var(--f-ui);color:var(--fg)}
.rm-h i{width:8px;height:8px;background:var(--faint)}
.rm-now .rm-h i{background:var(--signal)}
.rm-next .rm-h i{background:var(--accent-2,#B85E00)}
.rm-later .rm-h i{background:var(--line-2)}
.rm-done .rm-h i{background:var(--accent)}
.rm-h em{font:400 11px var(--f-mono);font-style:normal;color:var(--faint)}
.rm-h span{margin-left:auto;font:500 10.5px var(--f-mono);color:var(--faint)}
.rm ul{list-style:none;margin:0;padding:4px 0}
.rm li{display:flex;gap:10px;padding:6px 12px}
.rm li b{display:block;font-weight:500;font-size:12.5px;color:var(--fg)}
.rm li small{display:block;font-size:12px;color:var(--muted);line-height:1.45;margin-top:1px}
.rm-box{flex:none;width:14px;height:14px;margin-top:2px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--accent-fg);background:var(--paper)}
.rm li.done .rm-box{background:var(--accent);border-color:var(--accent)}
.rm li.done b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.rm-box .ic{width:10px;height:10px}
.upd-opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);background:var(--paper);cursor:pointer}
.upd-opt input{margin-top:3px;accent-color:var(--accent)}
.upd-opt b{display:block;font-weight:500;font-size:12.5px}
.upd-opt small{display:block;color:var(--muted);font-size:12px;line-height:1.45}
.upd-links{display:flex;gap:16px;margin-top:12px;font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.upd-links a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line-2)}
.upd-links a:hover{color:var(--fg);border-color:var(--fg)}
.upd-bar{height:4px;margin-top:10px;background:var(--line-3)}
.upd-bar i{display:block;height:100%;background:var(--signal);transition:width .2s}
.upd-empty{color:var(--faint);font-size:12.5px;padding:12px}
.ri.has-dot{position:relative}
.ri.has-dot::after{content:"";position:absolute;top:7px;right:16px;width:7px;height:7px;background:var(--lime,#D9F26C);box-shadow:0 0 0 2px var(--rail-bg,#0F3B26)}
.st-ver{color:inherit;text-decoration:none}
.st-ver:hover{text-decoration:underline}
.st-ver.is-new{color:var(--fg);font-weight:600;background:var(--lime,#D9F26C);color:#0A1F12;padding:0 6px}
@media (max-width:860px){.upd{padding:16px}.upd-cols{grid-template-columns:minmax(0,1fr)}.upd-facts{width:100%}.upd-facts div{flex:1}.upd-st{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){.upd-ic.spin .ic{animation:none}}
/* layout fixes: no page-level scroll, side panel scrolls with the page, single top spacing */
html,body{margin:0;padding:0;height:100%;overflow:hidden}
.home{overscroll-behavior:contain;scroll-padding-top:16px}
.home-in:has(>.bs){max-width:none;padding:0}
.bs{padding:22px 28px 48px;align-items:start}
.bs-hello{margin:0 0 14px}
.bs-side{position:static}
.note-grid{align-items:stretch}
@media (max-width:1100px){.bs{grid-template-columns:minmax(0,1fr)}.bs-side{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}}

<script type="application/json" id="halt-meta">{"version":"1.0.2","date":"2026-11-17","repo":"ssaad5678/haltspace","releases":[{"version":"1.0.2","date":"2026-11-17","title":"Your notes, every time","summary":"A fix for notes that seemed to disappear when the app was opened right after starting the computer.","groups":[{"name":"Fixed","items":["On a cold start, Haltspace gave the note database only 1.5 seconds to open and showed an empty workspace if it took longer. It now waits up to 12 seconds with an \"Opening your notes…\" message, and adds any notes that arrive later.","If the note database was briefly busy at startup, Haltspace stopped saving to it for the rest of the session. It now waits until the database is free."]}]},{"version":"1.0.1","date":"2026-11-16","title":"Steady notes","summary":"A quick fix for notes that shook when you scrolled to the bottom.","groups":[{"name":"Fixed","items":["Long notes no longer shake when you scroll to the very end. The reading-progress bar could grow a hair past 100%, which made a horizontal scrollbar flicker on and off."]}]},{"version":"1.0.0","date":"2026-11-16","title":"Haltspace for Windows","summary":"The first public release, now called **Haltspace**. Install it on Windows and it updates itself whenever a new version is published.","groups":[{"name":"Added","items":["**Windows app:** a real installer with a Start menu entry, its own window and one-click updates","**Updates** screen: shows your version, the full version history and the roadmap, and checks GitHub for new versions","Automatic update checks when the app opens, then every 6 hours; can be turned off in Updates","Can be installed as an app from the web version: its own window and icon, works offline, updates itself","Downloadable single-file version, attached to every GitHub release","Version number in the status bar; it turns lime when an update is ready"]},{"name":"Changed","items":["New name: **Haltspace** by halt.ae","PDFs and backups now save straight to your Downloads folder instead of opening in a new tab"]},{"name":"Fixed","items":["Home page: the status bar no longer gets cut off, the side panel no longer slides under the top bar when you scroll, and the extra gap at the top is gone","Runs on its own outside claude.ai and saves everything in your browser on this device"]}]},{"version":"0.9.0","date":"2026-11-16","title":"Workspace layout","summary":"A tidier, more professional layout built around the notes.","groups":[{"name":"Added","items":["Icon rail on the left with labeled buttons for Home, Today, Search, Calendar, Graph, Templates, Trash, Profile and theme","\"Tell me what you want to do\" command search in the title bar (`Ctrl K`)","Status bar with save state, page counts, and the current page's word and sheet count","Start screen with a quick-note box, START tiles, your notes, a recent files table and a side panel"]},{"name":"Changed","items":["Note toolbar groups now have labels: Undo, Clipboard, Style, Font, Paragraph, Lists, Insert, Page","Square corners, thin borders, IBM Plex Sans and Mono everywhere","Dotted desk behind note pages; decorative background art removed"]}]},{"version":"0.8.0","date":"2026-11-16","title":"halt.ae identity","summary":"","groups":[{"name":"Added","items":["halt.ae logo, wordmark and forest-and-lime colors","Note cards on the home screen with previews"]},{"name":"Changed","items":["Notes are the focus: less decoration, cleaner reading","Signature color palette: amber `#b85e00`, yellow `#ffe600`, green `#00d973`, blue `#0024cc`"]}]},{"version":"0.7.0","date":"2026-11-15","title":"Folders, search and safe saving","summary":"","groups":[{"name":"Added","items":["Folders and subfolders","Global search across every note, canvas and board (`Ctrl Shift F`)","User profile with name, avatar and accent color","Second copy of every page saved on your device, with automatic retries","Export and restore a full backup","Drawings inside notes can be dragged to a new spot"]},{"name":" function SearchView() {
  const root = h(`<div class="home search-page"><div class="home-in">
    <h1 class="hello">Search</h1><p class="hello-sub">Every note, canvas, board, card and folder in one place.</p>
    <label class="sx-box">${icon('search')}<input id="sx-in" placeholder="Type to search…" autocomplete="off" spellcheck="false" aria-label="Search everything"><span class="sx-count"></span></label>
    <div class="sx-filters" role="tablist"></div><div class="sx-results" role="listbox"></div></div></div>`);
  const inp = $('#sx-in', root), res = $('.sx-results', root), fil = $('.sx-filters', root), cnt = $('.sx-count', root);
  let kind = 'all', results = [], i = 0, tq;
  const KINDS = [['all', 'All', 'search'], ['note', 'Notes', 'note'], ['canvas', 'Canvases', 'canvas'], ['board', 'Boards', 'board'], ['card', 'Cards', 'todo'], ['folder', 'Folders', 'folder']];
  inp.value = LS.get('weave.lastq', '');
  function run() {
    const q = inp.value.trim(); LS.set('weave.lastq', q); const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const all = searchItems(); let found;
    if (!terms.length) found = all.filter(x => x.kind !== 'card').sort((a, b) => b.p.updated - a.p.updated).slice(0, 12).map(x => ({ ...x, score: 0 }));
    else found = all.map(x => { const ti = x.title.toLowerCase(), tx = stripMd(x.text).toLowerCase(); let sc = 0; for (const t of terms) { if (ti.includes(t)) sc += ti.startsWith(t) ? 9 : 6; else if (tx.includes(t)) sc += 2; else return null; } return { ...x, score: sc + (x.p.updated / 1e13) }; }).filter(Boolean).sort((a, b) => b.score - a.score);
    const by = { all: found.length }; for (const f of found) by[f.kind] = (by[f.kind] || 0) + 1;
    fil.innerHTML = KINDS.map(([k, l, ic]) => `<button class="sx-f ${kind === k ? 'on' : ''}" data-k="${k}">${icon(ic)}${l}<em>${by[k] || 0}</em></button>`).join('');
    results = (kind === 'all' ? found : found.filter(f => f.kind === kind)).slice(0, 60); i = 0;
    cnt.textContent = terms.length ? plural(found.length, 'result') : '';
    res.innerHTML = results.length ? (terms.length ? '' : `<div class="sx-h">Recently edited</div>`) + results.map((r, k) => {
      const tx = stripMd(r.text); let snip = '';
      if (terms.length && tx) { const lo = tx.toLowerCase(); const at = Math.min(...terms.map(t => { const j = lo.indexOf(t); return j < 0 ? Infinity : j; })); if (isFinite(at)) { const a = Math.max(0, at - 50); snip = (a ? '…' : '') + tx.slice(a, at + 110) + (at + 110 < tx.length ? '…' : ''); } }
      if (!snip) snip = r.kind === 'card' ? (r.text || '') : snippetOf(r.p, 120);
      const ty = r.kind === 'card' ? 'board' : r.kind;
      return `<button class="sx-r t-${ty} ${k === i ? 'on' : ''}" data-r="${k}" role="option" style="--i:${k}"><span class="sx-ic">${icon(r.kind === 'card' ? 'todo' : r.kind)}</span><span class="sx-body"><b>${hl(r.title, terms)}</b><small>${hl(snip, terms)}</small><span class="sx-path">${r.kind === 'card' ? 'Card · ' : TYPE_LABEL[r.kind] + ' · '}${esc(r.path)} · ${ago(r.p.updated)}</span></span></button>`;
    }).join('') : `<div class="empty-state">${icon('search')}<h2>Nothing found</h2><p>Try fewer words, or check the spelling. Search looks inside notes, canvas text, board cards and folders.</p></div>`;
  }
  function open(k) { const r = results[k]; if (!r) return; if (r.kind === 'card') { openPage(r.p.id); setTimeout(() => openCard(r.p.id, r.k.id), 80); } else openPage(r.p.id); }
  const paint = () => $$('.sx-r', res).forEach((b, k) => { b.classList.toggle('on', k === i); if (k === i) b.scrollIntoView({ block: 'nearest' }); });
  inp.addEventListener('input', () => { clearTimeout(tq); tq = setTimeout(run, 70); });
  inp.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { e.preventDefault(); i = Math.min(results.length - 1, i + 1); paint(); } else if (e.key === 'ArrowUp') { e.preventDefault(); i = Math.max(0, i - 1); paint(); } else if (e.key === 'Enter') { e.preventDefault(); open(i); } else if (e.key === 'Escape') { inp.value = ''; run(); } });
  fil.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) { kind = b.dataset.k; run(); inp.focus(); } });
  res.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) open(+b.dataset.r); });
  run();
  return { root, onPages: () => { if (document.activeElement !== inp) run(); }, mounted() { inp.focus(); inp.select(); } };
}

/* ================= Folders ================= */
function FolderView(page) {
  const id = page.id, P = () => Store.get(id);
  const root = h(`<div class="home folder-page"><div class="home-in">
    <div class="fd-head"><span class="fd-ic">${icon('folder')}</span><textarea class="page-title" rows="1" placeholder="Untitled folder" aria-label="Folder name" id="title-${id}"></textarea></div>
    <div class="page-meta fd-meta"></div>
    <div class="fd-new"><span>Add here:</span><button class="btn sm" data-fnew="note">${icon('note')} Note</button><button class="btn sm" data-fnew="canvas">${icon('canvas')} Canvas</button><button class="btn sm" data-fnew="board">${icon('board')} Board</button><button class="btn sm" data-fnew="folder">${icon('folder')} Subfolder</button><button class="btn sm" data-fmove>${icon('move')} Move a page here</button></div>
    <div class="fd-grid"></div></div></div>`);
  const t = $('.page-title', root), grid = $('.fd-grid', root), meta = $('.fd-meta', root);
  t.value = page.title || ''; wireTitle(t, id);
  function render() {
    const kids = Store.list().filter(p => p.parent === id).sort((a, b) => (a.type === 'folder' ? 0 : 1) - (b.type === 'folder' ? 0 : 1) || b.updated - a.updated);
    meta.innerHTML = `<span class="type-pill t-folder">${icon('folder')} Folder</span><span>${plural(kids.length, 'item')}</span><span>Drag pages onto a folder to move them</span>`;
    grid.innerHTML = kids.length ? kids.map((p, i) => `<a class="rc fd-card t-${p.type}" href="#p-${p.id}" draggable="true" data-pid="${p.id}" style="--i:${i}"><span class="rc-type">${icon(p.type)} ${TYPE_LABEL[p.type]}<em>${ago(p.updated)}</em></span><span class="rc-title">${esc(titleOf(p))}</span><span class="rc-snip">${esc(snippetOf(p))}</span></a>`).join('')
      : `<div class="empty-state">${icon('folder')}<h2>This folder is empty</h2><p>Add a note, canvas or board above, or drag pages here from the sidebar.</p></div>`;
  }
  root.addEventListener('click', e => {
    const n = e.target.closest('[data-fnew]'); if (n) { createPage(n.dataset.fnew, { parent: id }); return; }
    if (e.target.closest('[data-fmove]')) { const bad = new Set([id, ...Store.list().filter(p => p.parent === id).map(p => p.id)]); let q = P(), g = 0; while (q && g++ < 30) { bad.add(q.id); q = Store.get(q.parent); } openPalette('', { pick: true, placeholder: `Move a page into “${titleOf(P())}”…`, exclude: [...bad], onPick: pid => { movePage(Store.get(pid), id); toast('Moved into this folder'); } }); }
  });
  grid.addEventListener('dragstart', e => { const c = e.target.closest('[data-pid]'); if (!c) return; dragPageId = c.dataset.pid; e.dataTransfer.setData('text/weave-page', c.dataset.pid); e.dataTransfer.effectAllowed = 'move'; });
  grid.addEventListener('dragend', () => { dragPageId = null; $$('.drop', grid).forEach(x => x.classList.remove('drop')); });
  grid.addEventListener('dragover', e => { const c = e.target.closest('.fd-card.t-folder'); if (c && dragPageId && c.dataset.pid !== dragPageId) { e.preventDefault(); c.classList.add('drop'); } });
  grid.addEventListener('dragleave', e => { const c = e.target.closest('.fd-card'); if (c) c.classList.remove('drop'); });
  grid.addEventListener('drop', e => { const c = e.target.closest('.fd-card.t-folder'); if (!c || !dragPageId) return; e.preventDefault(); const p = Store.get(dragPageId); if (p) { movePage(p, c.dataset.pid); toast(`Moved into “${titleOf(Store.get(c.dataset.pid))}”`); } dragPageId = null; });
  render();
  return { root, onPages: () => { render(); if (document.activeElement !== t) t.value = P()?.title || ''; }, mounted() { autoGrow(t); if (focusTitleSoon) { t.focus(); t.select(); } } };
}

        await this.native.downloadAndInstall(ev => {
          if (ev.event === 'Started') total = ev.data.contentLength || 0;
          else if (ev.event === 'Progress') { got += ev.data.chunkLength || 0; const p = total ? Math.round(got / total * 100) : 0; if (p !== this.progress) { this.progress = p; if (route.view === 'updates' && activeView && activeView.render) activeView.render(); } }
        });
        await window.__TAURI__.process.relaunch();
      } catch { this.status = 'error'; this.paint(); toast("The update couldn't be installed. Try again, or download it from the release page."); }
      return;
    }
    if (this.where() === 'desktop') { if (this.latest && this.latest.url) this.openExternal(this.latest.url); return; }
    if (this.where() === 'web') {
      Store.flushAll();
      const go = () => location.reload();
      if (navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => { }).finally(() => setTimeout(go, 150)); else go();
    } else if (this.latest && this.latest.url) window.open(this.latest.url, '_blank', 'noopener');
  },
  async installApp() { if (!this.install) return; this.install.prompt(); try { await this.install.userChoice; } catch { } this.install = null; this.paint(); },
  paint() { renderStatus(); renderRail(); if (route.view === 'updates' && activeView && activeView.render) activeView.render(); }
};

function UpdatesView() {
  const root = h('<div class="home upd-page"><div class="upd"></div></div>'), inner = $('.upd', root);
  const WHERE = { desktop: ['Windows app', 'Installs new versions with one click'], web: ['Web app', 'Updates itself when you open it'], file: ['Downloaded file', 'Checks GitHub for new releases'], artifact: ['Online preview', 'Running inside claude.ai'] };
  const rels = META.releases || [], cur = rels.find(r => r.version === APP_VERSION) || rels[0];
  const groupsHTML = gs => (gs || []).map(g => `<div class="rel-g"><h4>${esc(g.name)}</h4><ul>${g.items.map(t => `<li>${inlineMd(t)}</li>`).join('')}</ul></div>`).join('');
  const bodyHTML = md => {
    const out = []; let list = false;
    for (const ln of String(md || '').split(/\r?\n/)) {
      const t = ln.trim(); if (!t) continue;
      if (/^[-*] /.test(t)) { if (!list) { out.push('<ul>'); list = true; } out.push(`<li>${inlineMd(t.slice(2))}</li>`); continue; }
      if (list) { out.push('</ul>'); list = false; }
      if (/^#{1,4} /.test(t)) out.push(`<h4>${esc(t.replace(/^#+ /, ''))}</h4>`); else out.push(`<p>${inlineMd(t)}</p>`);
    }
    if (list) out.push('</ul>'); return `<div class="rel-g">${out.join('')}</div>`;
  };
  function statusHTML() {
    const U = Updates, where = U.where(), L = U.latest, checked = U.checkedAt ? `Last checked ${ago(U.checkedAt)}` : 'Not checked yet';
    const checkBtn = `<button class="btn" data-check>${icon('refresh')} Check now</button>`;
    if (U.status === 'checking') return `<div class="upd-st s-checking"><span class="upd-ic spin">${icon('refresh')}</span><div><b>Checking for updates…</b><small>Asking GitHub for the newest release</small></div></div>`;
    if (U.status === 'installing') return `<div class="upd-st s-new"><span class="upd-ic spin">${icon('refresh')}</span><div><b>Installing Haltspace ${esc(L ? L.version : '')}…</b><small>${U.progress ? U.progress + '% downloaded · ' : ''}Haltspace restarts by itself when it's done. Your work is saved.</small><div class="upd-bar"><i style="width:${U.progress || 4}%"></i></div></div></div>`;
    if (U.status === 'available') {
      const isWeb = where === 'web' || (where === 'desktop' && !!U.native);
      return `<div class="upd-st s-new"><span class="upd-ic">${icon('download')}</span><div class="upd-st-t"><b>Version ${esc(L.version)} is ready${L.title ? ` · ${esc(L.title)}` : ''}</b><small>${L.date ? 'Released ' + esc(fmtDate(L.date)) + ' · ' : ''}you have ${esc(APP_VERSION)}</small>
        <div class="upd-notes">${L.groups ? groupsHTML(L.groups) : bodyHTML(L.body)}</div>
        ${isWeb ? '' : where === 'desktop' ? `<p class="upd-hint">This downloads the installer. Run it and Haltspace updates in place; your notes stay where they are.</p>` : `<p class="upd-hint">Save the new file in the same place, with the same name, as the one you're using now. Your notes are stored in this browser, so they'll still be there when you open the new file. Save a backup first if you'd like to be extra safe.</p>`}
        <div class="upd-acts">${isWeb ? `<button class="btn primary" data-apply>${icon('refresh')} Restart to update</button>` : `<button class="btn primary" data-apply>${icon('download')} ${where === 'desktop' ? 'Download installer' : 'Download ' + esc(L.version)}</button><button class="btn" data-backup>${icon('upload')} Save a backup</button>`}${L.page ? `<a class="btn" href="${esc(L.page)}" target="_blank" rel="noopener">Release page</a>` : ''}</div></div></div>`;
    }
    if (U.status === 'unconfigured') return `<div class="upd-st"><span class="upd-ic">${icon('cloudoff')}</span><div><b>Update checks aren't set up in this copy</b><small>Copies downloaded from the app's GitHub page check for updates automatically.</small></div></div>`;
    if (U.status === 'error' || U.status === 'offline') return `<div class="upd-st s-err"><span class="upd-ic">${icon('cloudoff')}</span><div><b>${U.status === 'offline' ? "You're offline" : "Couldn't reach GitHub"}</b><small>${U.status === 'offline' ? "We'll check again when you're back online." : 'Try again in a few minutes.'} ${checked}</small></div>${checkBtn}</div>`;
    if (U.status === 'current') return `<div class="upd-st s-ok"><span class="upd-ic">${icon('check')}</span><div><b>You're up to date</b><small>Haltspace ${esc(APP_VERSION)} is the newest version · ${checked}</small></div>${checkBtn}</div>`;
    return `<div class="upd-st"><span class="upd-ic">${icon('refresh')}</span><div><b>Haltspace ${esc(APP_VERSION)}</b><small>${where === 'artifact' ? 'This preview always shows the latest published version.' : checked}</small></div>${checkBtn}</div>`;
  }
  function render() {
    const where = Updates.where(), [wName, wSub] = WHERE[where], rm = META.roadmap || [], repo = META.repo || '';
    const relHTML = rels.map((r, i) => `<details class="rel${r.version === APP_VERSION ? ' cur' : ''}"${i < 2 ? ' open' : ''}><summary><span class="rel-v">${esc(r.version)}</span><b>${esc(r.title || 'Release')}</b>${r.version === APP_VERSION ? '<span class="rel-tag">Installed</span>' : ''}<em>${r.date ? esc(fmtDate(r.date)) + ' ' + esc(r.date.slice(0, 4)) : ''}</em></summary>${r.summary ? `<p class="rel-sum">${inlineMd(r.summary)}</p>` : ''}${groupsHTML(r.groups)}</details>`).join('');
    const rmHTML = rm.map(g => `<div class="rm-g rm-${esc(g.key)}"><div class="rm-h"><i></i>${esc(g.name)}${g.note ? `<em>${esc(g.note)}</em>` : ''}<span>${g.items.length}</span></div><ul>${g.items.map(it => `<li class="${it.done ? 'done' : ''}"><span class="rm-box">${it.done ? icon('check') : ''}</span><div><b>${inlineMd(it.title)}</b>${it.desc ? `<small>${inlineMd(it.desc)}</small>` : ''}</div></li>`).join('')}</ul></div>`).join('');
    inner.innerHTML = `
      <header class="upd-head">
        <div class="upd-id"><div class="side-logo"><img src="${ROPE_T}" alt=""></div><div><div class="upd-k">Haltspace by halt.ae</div><h1>Version ${esc(APP_VERSION)}</h1><p>${cur ? `${esc(cur.title || '')}${cur.date ? ' · released ' + esc(fmtDate(cur.date)) : ''}` : ''}</p></div></div>
        <dl class="upd-facts"><div><dt>Running as</dt><dd>${wName}</dd></div><div><dt>Updates</dt><dd>${wSub}</dd></div><div><dt>Releases</dt><dd>${rels.length}</dd></div></dl>
      </header>
      ${statusHTML()}
      ${Updates.install ? `<div class="upd-install"><div><b>Install halt.ae as an app</b><small>It gets its own window and icon, works offline and updates itself.</small></div><button class="btn primary" data-install>${icon('download')} Install app</button></div>` : ''}
      <div class="upd-cols">
        <section><div class="bs-label">Version history <em>${rels.length}</em></div><div class="rel-list">${relHTML || '<p class="upd-empty">No releases yet.</p>'}</div></section>
        <section><div class="bs-label">Roadmap <em>what's coming</em></div><div class="rm">${rmHTML || '<p class="upd-empty">No roadmap yet.</p>'}</div>
          <div class="bs-label">Settings</div>
          <label class="upd-opt"><input type="checkbox" data-auto ${Updates.auto() ? 'checked' : ''} ${where === 'artifact' ? 'disabled' : ''}><span><b>Check for updates automatically</b><small>Looks for a new version when you open the app, then every 6 hours. Your notes are never sent anywhere.</small></span></label>
          ${repo ? `<div class="upd-links"><a href="https://github.com/${esc(repo)}" target="_blank" rel="noopener">GitHub</a><a href="https://github.com/${esc(repo)}/releases" target="_blank" rel="noopener">All releases</a><a href="https://github.com/${esc(repo)}/issues/new" target="_blank" rel="noopener">Report a problem</a></div>` : ''}
        </section>
      </div>`;
  }
  root.addEventListener('click', e => {
    if (e.target.closest('[data-check]')) Updates.check(true);
    else if (e.target.closest('[data-apply]')) Updates.apply();
    else if (e.target.closest('[data-backup]')) exportBackup();
    else if (e.target.closest('[data-install]')) Updates.installApp();
  });
  root.addEventListener('change', e => { if (e.target.matches('[data-auto]')) { LS.set('halt.upd.auto', e.target.checked); toast(e.target.checked ? 'Automatic update checks are on' : 'Automatic update checks are off'); } });
  render();
  return { root, render, mounted() { if (Updates.where() !== 'artifact' && (Updates.status === 'idle' || Date.now() - Updates.checkedAt > 600e3)) Updates.check(true); } };
}

/* ================= Boot ================= */
function staticIcons() {
  $('#sb-close').innerHTML = icon('x'); $('#sb-open').innerHTML = icon('menu'); $('#new-root').innerHTML = icon('plus');
  $('.search-btn .sicon').outerHTML = icon('search'); $('#tellme .tm-ic').outerHTML = icon('search');
  $('[data-nav="home"]').innerHTML = icon('home') + '<span>Home</span>'; $('[data-nav="graph"]').innerHTML = icon('graph') + '<span>Graph</span>';
  $('[data-nav="today"]').innerHTML = icon('sun') + '<span>Today</span>'; $('[data-nav="calendar"]').innerHTML = icon('cal') + '<span>Calendar</span>'; $('[data-nav="templates"]').innerHTML = icon('template') + '<span>Templates</span>'; $('#trash-link').innerHTML = icon('trash') + '<span>Trash</span>';
  for (const t of ['note', 'canvas', 'board', 'folder']) $(`.sb-new [data-new="${t}"]`).innerHTML = icon(t) + `<span>${TYPE_LABEL[t]}</span>`;
}
document.addEventListener('click', e => { const tp = e.target.closest('[data-templates]'); if (tp) { e.preventDefault(); openTemplates(tp.dataset.templates ? { tab: tp.dataset.templates } : {}); closeDrawer(); return; } const b = e.target.closest('[data-new]'); if (b) { e.preventDefault(); createPage(b.dataset.new, { parent: b.dataset.parent || null }); closeDrawer(); } });
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.shiftKey && e.key.toLowerCase() === 'f') { e.preventDefault(); location.hash = 'search'; return; }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); pal ? closePalette() : openPalette(); return; }
  if (e.key === 'Escape') { if (fpOpen) { fpOpen.close(); return; } if (pop) { closePop(); return; } if (pal) { closePalette(); return; } if (modal) { closeModal(); return; } }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('tag')) { openPalette('#' + e.target.dataset.tag); return; }
  if (mod && e.key.toLowerCase() === 'e' && activeView && activeView.toggleMode) { e.preventDefault(); activeView.toggleMode(); return; }
  if (sketchOpen) { if (e.key === 'Escape' && !pal && !pop && !modal && !fpOpen) { e.preventDefault(); closeSketch(); return; } sketchOpen.v.onKey(e); return; }
  activeView && activeView.onKey && activeView.onKey(e);
});
window.addEventListener('hashchange', renderRoute);
document.addEventListener('pointerdown', e => {
  if (REDUCED) return; const b = e.target.closest('.rb,.tool,.btn,.q,.sq,.tpl-chip,.tpl-card,.nav a,.sb-new button,.pb,.slash-i,.theme-btn'); if (!b) return;
  const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height) * 1.2, sp = document.createElement('span'); sp.className = 'ripple';
  sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`; b.append(sp); setTimeout(() => sp.remove(), 600);
}, { passive: true });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
if (document.fonts) document.fonts.ready.then(() => emit('fonts'));

function applyTheme(mode) { document.documentElement.classList.toggle('wv-dark', mode === 'dark'); const b = $('#theme-btn'); if (b) b.innerHTML = mode === 'dark' ? icon('sun') + '<span>Light mode</span>' : icon('moon') + '<span>Dark mode</span>'; }
async function boot() {
  applyTheme(LS.get('weave.theme', 'light'));
  $('#theme-btn').onclick = () => { const m = document.documentElement.classList.contains('wv-dark') ? 'light' : 'dark'; LS.set('weave.theme', m); applyTheme(m); };
  staticIcons(); renderRail(); readTheme(); wireSidebar();
  try { localStorage.setItem('weave.t', '1'); localStorage.removeItem('weave.t'); } catch { lsOk = false; }
  $('#view').innerHTML = '<div class="loading">Opening your notes…</div>';
  const loadP = Local.loadAll();
  const fromDb = await Promise.race([loadP, new Promise(r => setTimeout(() => r(null), 12000))]);
  if (!fromDb) loadP.then(rows => { if (!rows || !rows.length) return; let n = 0; for (const p of rows) if (p && p.id && !Store.pages.has(p.id)) { Store.pages.set(p.id, p); n++; } if (n) { changed(); renderRoute(); toast(`Loaded ${plural(n, "page")} from this device`); } });
  if (fromDb && fromDb.length) { for (const p of fromDb) if (p && p.id) Store.pages.set(p.id, p); }
  else { const cached = LS.get(KEY, null); if (cached && Array.isArray(cached.pages)) for (const p of cached.pages) if (p && p.id) { Store.pages.set(p.id, p); Local.queue(p.id); } }
  applyPrefs();
  addEventListener('pagehide', () => Store.flushAll()); document.addEventListener('visibilitychange', () => { if (document.hidden) Store.flushAll(); });
  addEventListener('online', () => { if (Store.mode === 'cloud') [...Store.unsynced].forEach(id => { if (!Store.timers.has(id) && !Store.writing.has(id)) Store.flush(id); }); });
  setInterval(() => { if (Store.mode === 'cloud' && navigator.onLine !== false) [...Store.unsynced].forEach(id => { if (!Store.timers.has(id) && !Store.writing.has(id)) Store.flush(id); }); }, 30000);
  setSync('pending');
  Updates.boot();
  if (!location.hash) { const last = LS.get('weave.last', null); if (last && Store.get(last)) history.replaceState(null, '', '#p-' + last); }
  renderRoute();
  let db = null, user = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch { db = null; }
  }
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('sample').then(sm => { sampleApi = sm || null; emit('sample'); }, () => { });
    window.claude.use('assets').then(as => { assetsApi = as || null; }, () => { });
    window.claude.use('downloads').then(dl => { downloadsApi = dl || null; }, () => { });
  }
  if (user) user.me().then(m => { if (m) { meInfo = m; renderMe(); if (route.view === 'home' && activeView && activeView.onPages) activeView.onPages(); } }, () => { });
  if (db && user) { try { if ((await user.can('data.write')) === false) { db = null; readOnly = true; } } catch { } }
  if (!db) {
    Store.loaded = true; Store.startMode('local'); setSync('local'); changed(); onRemote(new Set(), true);
    return;
  }
  Store.col = db.collection('pages'); Store.db = db; HFT.load(); Prefs.load();
  setTimeout(() => { const old = Store.all().filter(p => p.trashed && Date.now() - p.trashed > 30 * 864e5).map(p => p.id); if (old.length) purge(old); }, 6000);
  const timer = setTimeout(() => { if (!Store.loaded) { setSync('offline'); Store.loaded = true; changed(); onRemote(new Set(), true); } }, 10000);
  Store.startMode('cloud');
  Store.col.onSnapshot(snap => { if (!snap.metadata.fromCache) clearTimeout(timer); Store.onSnap(snap); if (!snap.metadata.fromCache) Store.settle(); },
    err => { clearTimeout(timer); setSync('offline'); if (!Store.loaded) { Store.loaded = true; changed(); onRemote(new Set(), true); } });
}
boot();
</script>
